<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>How did we do? | FX Airguns</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#e9ecef;--panel:#ffffff;--ink:#16191c;--slate:#5c646d;--line:#d5dade;
  --pick:#1d7a6f;--pick-ink:#ffffff;--warn:#b23b2a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --steel:#14171a;--panel:#1e2226;--ink:#eef0f2;--slate:#a4acb5;--line:#343a40;
    --pick:#3fb3a6;--pick-ink:#0e1113;--warn:#ef8b7c;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo{filter:invert(1)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--steel);color:var(--ink);font-family:Barlow,Arial,sans-serif;font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.logo{height:30px;display:block;margin-bottom:34px}
h1{font-family:'Barlow Condensed',Arial Narrow,sans-serif;font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.01em}
h1 .rifle{display:block;font-size:56px}
.lede{color:var(--slate);margin:14px 0 28px;max-width:44ch}
.panel{background:var(--panel);border-radius:14px;padding:6px 22px 24px;border:1px solid var(--line)}
fieldset{border:0;padding:22px 0 20px;border-bottom:1px solid var(--line)}
fieldset:last-of-type{border-bottom:0}
legend{font-weight:600;font-size:18px;padding:0;margin-bottom:12px;display:flex;gap:10px}
legend .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--slate);min-width:16px}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{font:inherit;font-size:16px;min-height:48px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;flex:1 1 auto}
.opt button[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink);font-weight:600}
.stars button{flex:0 0 52px;padding:0;font-size:26px;line-height:1;color:var(--line)}
.stars button.lit{color:var(--pick);border-color:var(--pick)}
.stars button[aria-pressed="true"]{color:var(--pick-ink)}
.stars .say{align-self:center;color:var(--slate);font-size:15px;margin-left:4px;flex:1 1 100%}
.scale button{flex:1 0 40px;padding:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;min-width:40px}
.ends{display:flex;justify-content:space-between;color:var(--slate);font-size:14px;margin-top:6px}
textarea{width:100%;min-height:110px;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
textarea:focus{border-color:var(--pick);outline:none}
.send{margin-top:22px;width:100%;min-height:56px;border:0;border-radius:12px;background:var(--ink);color:var(--panel);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;cursor:pointer}
.send:disabled{opacity:.55;cursor:default}
.err{color:var(--warn);font-size:15px;margin-top:12px;min-height:1px}
.done h1{font-size:48px}
.note{color:var(--slate);font-size:15px;margin-top:22px}
.skeleton{color:var(--slate)}
@media (max-width:420px){h1{font-size:38px}h1 .rifle{font-size:46px}.panel{padding:4px 16px 20px}.scale button{flex-basis:calc(16.66% - 8px)}}
@media (prefers-reduced-motion:no-preference){.send,.opt button{transition:background-color .12s,border-color .12s,color .12s}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <img class="logo" src="https://www.fxairguns.com/images/logo.png" alt="FX Airguns">
  <p class="skeleton">Loading your survey…</p>
</main>
<script>
const SERVER = 'https://fx-tracking-server.onrender.com';
const token = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
const LOGO = '<img class="logo" src="https://www.fxairguns.com/images/logo.png" alt="FX Airguns">';
const A = { overall: null, fixed: null, performance: null, communication: null, turnaround: null, nps: null };
const STAR_WORDS = ['', 'Very poor', 'Poor', 'Okay', 'Good', 'Excellent'];
let who = { first: '', model: 'rifle' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function message(title, text) {
  app.innerHTML = `${LOGO}<div class="done"><h1>${esc(title)}</h1><p class="lede">${esc(text)}</p></div>`;
}

function stars(key, label, n) {
  return `<fieldset><legend><span class="n">${n}</span><span>${label}</span></legend>
    <div class="opt stars" role="group">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="false" aria-label="${v} of 5, ${STAR_WORDS[v]}">★</button>`).join('')}
    <span class="say" id="say-${key}" aria-live="polite"></span></div></fieldset>`;
}
function choice(key, label, n, opts) {
  return `<fieldset><legend><span class="n">${n}</span><span>${label}</span></legend>
    <div class="opt" role="group">${opts.map(o => `<button type="button" data-k="${key}" data-v="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('')}</div></fieldset>`;
}

function form() {
  app.innerHTML = `${LOGO}
    <h1>${who.first ? esc(who.first) + ', your' : 'Your'}<span class="rifle">${esc(who.model.replace(/^FX\s+/i, ''))}</span>is back. How did we do?</h1>
    <p class="lede">Seven quick questions about your repair. Your answers go straight to our service team.</p>
    <form class="panel" id="f" novalidate>
      ${stars('overall', 'Overall, how satisfied are you with your repair?', 1)}
      ${choice('fixed', 'Is the problem you sent the rifle in for fixed?', 2, ['Yes', 'Partly', 'No'])}
      ${choice('performance', 'How is the rifle performing since it came back?', 3, ['Better than ever', 'As it should', 'Not quite right'])}
      ${stars('communication', 'How was our communication during the repair?', 4)}
      ${choice('turnaround', 'Was the turnaround time what you expected?', 5, ['Faster', 'About right', 'Slower'])}
      <fieldset><legend><span class="n">6</span><span>How likely are you to recommend FX Airguns to a friend?</span></legend>
        <div class="opt scale" role="group">${Array.from({ length: 11 }, (_, v) => `<button type="button" data-k="nps" data-v="${v}" aria-pressed="false">${v}</button>`).join('')}</div>
        <div class="ends"><span>Not likely</span><span>Very likely</span></div></fieldset>
      <fieldset><legend><span class="n">7</span><span>Anything else you’d like to tell us? <span style="color:var(--slate);font-weight:400;">(optional)</span></span></legend>
        <textarea id="comment" maxlength="3000" aria-label="Anything else you’d like to tell us"></textarea></fieldset>
      <button class="send" id="send" type="submit">Send my answers</button>
      <p class="err" id="err" role="alert"></p>
    </form>`;
  document.getElementById('f').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k, v = b.dataset.v;
    A[k] = ['overall', 'communication', 'nps'].includes(k) ? Number(v) : v;
    document.querySelectorAll(`button[data-k="${k}"]`).forEach(x => {
      const on = x.dataset.v === v;
      x.setAttribute('aria-pressed', String(on));
      if (x.closest('.stars')) x.classList.toggle('lit', Number(x.dataset.v) <= Number(v));
    });
    const say = document.getElementById('say-' + k); if (say) say.textContent = STAR_WORDS[Number(v)] || '';
    document.getElementById('err').textContent = '';
  });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const missing = Object.keys(A).filter(k => A[k] == null);
    const err = document.getElementById('err');
    if (missing.length) { err.textContent = 'Please answer questions 1 to 6 before sending.'; return; }
    const btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const res = await fetch(SERVER + '/survey', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ t: token, comment: document.getElementById('comment').value }, A)) });
      const out = await res.json().catch(() => ({}));
      if (res.status === 409) return message('Already received', 'We already have your answers for this repair. Thank you.');
      if (!res.ok) throw new Error(out.error || 'The answers could not be sent.');
      const unhappy = A.fixed !== 'Yes' || A.performance === 'Not quite right' || A.overall <= 2;
      message('Thank you' + (who.first ? ', ' + who.first : '') + '.',
        unhappy ? 'Your answers went straight to our service team. If something still isn’t right with your rifle, reply to your support ticket and we’ll help.'
                : 'Your answers went straight to our service team. Enjoy your rifle.');
    } catch (ex) {
      btn.disabled = false; btn.textContent = 'Send my answers';
      err.textContent = (ex.message || 'The answers could not be sent.') + ' Check your connection and press Send again.';
    }
  });
}

(async () => {
  if (token.length < 16) return message('This link isn’t complete', 'Open the survey from the link in your email. If you copied it, make sure you copied the whole link.');
  try {
    const res = await fetch(SERVER + '/survey?t=' + encodeURIComponent(token));
    const out = await res.json().catch(() => ({}));
    if (res.status === 404) return message('This link isn’t valid', 'Open the survey from the link in your email. If you copied it, make sure you copied the whole link.');
    if (!res.ok) throw new Error();
    if (out.answered) return message('Already received', 'We already have your answers for this repair. Thank you.');
    who = { first: out.first || '', model: out.model || 'rifle' };
    form();
  } catch (e) {
    message('The survey didn’t load', 'Check your connection and refresh the page. If it still doesn’t load, try again in a few minutes.');
  }
})();
</script>
</body>
</html>
