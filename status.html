<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your repair | FX Airguns</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#e9ecef;--panel:#ffffff;--ink:#16191c;--slate:#5c646d;--line:#d5dade;
  --pick:#1d7a6f;--pick-ink:#ffffff;--hold:#8a5a00;--hold-bg:#fbf1dc;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --steel:#14171a;--panel:#1e2226;--ink:#eef0f2;--slate:#a4acb5;--line:#343a40;
    --pick:#3fb3a6;--pick-ink:#0e1113;--hold:#f2c94c;--hold-bg:#2c2510;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo{filter:invert(1)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--steel);color:var(--ink);font-family:Barlow,Arial,sans-serif;font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.logo{height:30px;display:block;margin-bottom:34px}
h1{font-family:'Barlow Condensed',Arial Narrow,sans-serif;font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.01em}
h1 .rifle{display:block;font-size:56px}
.lede{color:var(--slate);margin:14px 0 24px;max-width:44ch}
.panel{background:var(--panel);border-radius:14px;padding:22px;border:1px solid var(--line)}
.hold{background:var(--hold-bg);color:var(--hold);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-weight:600}
ol{list-style:none;position:relative}
li{position:relative;padding:0 0 22px 40px;min-height:30px}
li:last-child{padding-bottom:0}
li::before{content:'';position:absolute;left:11px;top:26px;bottom:-2px;width:2px;background:var(--line)}
li:last-child::before{display:none}
li.done::before{background:var(--pick)}
.dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
li.done .dot{background:var(--pick);border-color:var(--pick)}
li.done .dot::after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--pick-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
li.now .dot{border-color:var(--pick);box-shadow:0 0 0 4px color-mix(in srgb, var(--pick) 22%, transparent)}
li.now .dot::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--pick)}
.st{font-weight:600}
li.todo .st{color:var(--slate);font-weight:500}
li.now .st{font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1.1}
.when{color:var(--slate);font-size:15px}
.track{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.track a{display:inline-block;margin-top:8px;background:var(--ink);color:var(--panel);text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:600}
.track a:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.help{color:var(--slate);font-size:15px;margin-top:22px}
@media (max-width:420px){h1{font-size:38px}h1 .rifle{font-size:46px}.panel{padding:18px 16px}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <img class="logo" src="https://www.fxairguns.com/images/logo.png" alt="FX Airguns">
  <p class="lede">Loading your repair…</p>
</main>
<script>
const SERVER = 'https://fx-tracking-server.onrender.com';
const token = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
const LOGO = '<img class="logo" src="https://www.fxairguns.com/images/logo.png" alt="FX Airguns">';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function day(iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : ''; }
function message(title, text) { app.innerHTML = `${LOGO}<h1>${esc(title)}</h1><p class="lede">${esc(text)}</p>`; }

function show(d) {
  const now = d.stages.find(s => s.now) || d.stages[0];
  const lede = now.name === 'Delivered' ? (d.pickup ? 'You’ve picked up your rifle. Thank you for choosing FX Airguns.' : 'Your rifle has been delivered. Thank you for choosing FX Airguns.')
    : now.name === 'Shipped' ? 'Your rifle is on its way back to you.'
    : now.name === 'Ready to ship' ? (d.pickup ? 'Your rifle is ready for pickup.' : 'Your rifle is repaired, tested and ready to ship.')
    : 'Here’s where your repair is right now. This page updates as we work.';
  const rename = { 'Delivered': 'Picked up', 'Ready to ship': 'Ready for pickup' };
  const stages = d.pickup ? d.stages.filter(s => s.name !== 'Shipped').map(s => rename[s.name] ? Object.assign({}, s, { name: rename[s.name] }) : s) : d.stages;
  app.innerHTML = `${LOGO}
    <h1>${d.first ? esc(d.first) + ', your' : 'Your'}<span class="rifle">${esc(String(d.model || 'rifle').replace(/^FX\s+/i, ''))}</span>repair</h1>
    <p class="lede">${esc(lede)}</p>
    <section class="panel" aria-label="Repair progress">
      ${d.waiting && !now.name.match(/Shipped|Delivered/) ? `<p class="hold">${esc(d.waiting)}</p>` : ''}
      <ol>${stages.map(s => `<li class="${s.done ? 'done' : s.now ? 'now' : 'todo'}"${s.now ? ' aria-current="step"' : ''}><span class="dot" aria-hidden="true"></span>
        <div class="st">${esc(s.name)}</div>${s.at ? `<div class="when">${esc(day(s.at))}</div>` : ''}</li>`).join('')}</ol>
      ${d.tracking ? `<div class="track"><div><b>${esc(d.tracking.carrier)}</b> tracking number ${esc(d.tracking.number)}</div>${d.tracking.url ? `<a href="${esc(d.tracking.url)}" target="_blank" rel="noopener">Track your package</a>` : ''}</div>` : ''}
    </section>
    <p class="help">Have a question about your repair? Reply to your support ticket${d.ticket ? ' #' + esc(d.ticket) : ''} and our team will get back to you.</p>`;
}

(async () => {
  if (token.length < 16) return message('This link isn’t complete', 'Open your repair status from the link we sent you. If you copied it, make sure you copied the whole link.');
  try {
    const res = await fetch(SERVER + '/repair-status?t=' + encodeURIComponent(token));
    const out = await res.json().catch(() => ({}));
    if (res.status === 404) return message('This link isn’t valid', 'Open your repair status from the link we sent you. If you copied it, make sure you copied the whole link.');
    if (!res.ok) throw new Error();
    show(out);
  } catch (e) {
    message('Your repair status didn’t load', 'Check your connection and refresh the page. If it still doesn’t load, try again in a few minutes.');
  }
})();
</script>
</body>
</html>
