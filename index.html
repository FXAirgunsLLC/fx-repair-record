<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Repair Record (test)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1214;--surface:#171b1f;--raised:#1f2429;--line:#2c3238;--line2:#3a4148;
  --text:#e6e8eb;--muted:#a3abb5;--dim:#8b939d;
  --teal:#50c8c0;--teal-dk:#1f3535;--teal-soft:#7fdcd6;
  --warn:#f2c94c;--warn-soft:rgba(242,201,76,.14);
  --red:#e27b6b;--red-soft:rgba(226,123,107,.14);
  --blue:#6fa9e6;--blue-soft:rgba(111,169,230,.14);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0f1214}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;height:56px}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.testtag{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--warn);color:#1a1608;border-radius:4px;padding:2px 7px}
.top .grow{flex:1}
.user{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
main{max-width:1360px;margin:0 auto;padding:22px 24px 60px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1.1}
h2{font-size:15px;font-weight:700}
.lede{color:var(--muted);margin:4px 0 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{min-height:42px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--text);box-shadow:inset 0 -3px 0 var(--teal)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input{max-width:340px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap;background:var(--raised);color:var(--muted)}
.pill.step{background:var(--teal-dk);color:var(--teal-soft)}
.pill.hold{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--red-soft);color:var(--red)}
.pill.test{background:var(--warn);color:#1a1608}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{display:flex;flex-direction:column;padding:8px 12px;border-radius:6px;min-width:108px;background:#1a1e22;color:var(--muted);border:1px solid var(--line)}
.stage b{font-size:13px}
.stage span{font-size:11px;opacity:.9}
.stage.done{background:var(--teal-dk);color:var(--teal-soft);border-color:#2f5a57}
.stage.now{background:var(--teal);color:#0f1214;border-color:var(--teal)}
.clock{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.track{flex:1 1 260px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.track div{height:100%;background:var(--teal)}
.track.late div{background:var(--red)}
.track.warn div{background:var(--warn)}
.layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;margin-top:18px}
.mainc{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side{flex:1 1 320px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.f .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.f .src{font-size:11px;color:var(--teal-soft)}
.f.miss{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:8px 10px;margin:4px -10px}
.f.miss .src{color:var(--warn);font-weight:700}
.f input,.f textarea,.f select{background:transparent;border:1px solid transparent;padding:4px 6px;margin-left:-6px;font-weight:600}
.f input:hover,.f textarea:hover,.f select:hover{border-color:var(--line2)}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal);background:var(--bg)}
.f textarea{min-height:64px;font-weight:500}
.soon{border:1px dashed var(--line2);border-radius:8px;padding:22px;color:var(--muted);text-align:center}
.hist li{list-style:none;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--dim);font-size:12px}
.holdbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--dim)}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.modal-wrap.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:10px;width:min(560px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;display:none;max-width:90vw}
#toast.show{display:block}
#toast.err{border-color:var(--red);color:var(--red)}
#auth{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
#auth.hidden{display:none}
.auth-box{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:30px;width:320px;display:flex;flex-direction:column;gap:10px}
.auth-err{color:var(--red);font-size:12px;min-height:14px;text-align:center}
/* Assessment */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sec.open{border-color:var(--teal)}
.sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:transparent;border:0;color:var(--text);text-align:left;min-height:48px}
.sec.open .sec-h{background:var(--raised)}
.sec-b{padding:6px 16px 16px;display:flex;flex-direction:column;gap:6px}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow.miss .alab::after{content:' •';color:var(--warn)}
.alab{width:230px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:#c5cbd2;font-size:13px}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--teal);border-color:var(--teal);color:#0f1214;font-weight:700}
.mini{width:110px;padding:6px 8px}
input.need{border-color:var(--warn);background:var(--warn-soft)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:8px}
.find{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.btn.teal{border-color:var(--teal);background:var(--teal-dk);color:var(--teal-soft)}
.prow{display:flex;gap:8px;margin-bottom:6px}
.phwrap{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:120px;height:90px;border-radius:6px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
.drop{border:1px dashed var(--line2);border-radius:6px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--teal);background:var(--teal-dk)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.strrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.shotpic{flex:0 0 240px;display:flex;flex-direction:column;gap:8px}
.shotpic img{width:100%;max-height:220px;object-fit:contain;border-radius:6px;background:var(--line)}
.shots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.shot{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-align:center}
.shot input{text-align:center;padding:6px 2px;font-size:14px;font-weight:600}
.shot.unsure input{border:2px solid var(--warn);background:var(--warn-soft)}
.statrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{background:var(--raised);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-size:26px;line-height:1.1}
.stdt input{min-width:90px;padding:6px 8px}
.stdt td{padding:6px 4px}
@media(max-width:760px){.grid3{grid-template-columns:1fr}.alab{width:100%}.grid4{grid-template-columns:1fr 1fr}.shots{grid-template-columns:repeat(5,minmax(0,1fr))}.statrow{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="auth"><div class="auth-box">
  <h1 style="text-align:center;font-size:26px;">Repair Record</h1>
  <input type="email" id="auth-email" placeholder="Email" autocomplete="username">
  <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" id="auth-btn" onclick="signIn()" style="justify-content:center;">Sign in</button>
  <div class="auth-err" id="auth-err"></div>
</div></div>

<header class="top">
  <span class="brand">Repair Record</span><span class="testtag">TEST</span>
  <span class="grow"></span>
  <div class="user"><span id="user-email"></span><button class="btn sm ghost" onclick="signOut()">Log out</button></div>
</header>
<main id="view"></main>

<div class="modal-wrap" id="modal"><div class="modal" id="modal-body"></div></div>
<div id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const SB_URL = 'https://rhvmzaljkgqnwjcstnen.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJodm16YWxqa2dxbndqY3N0bmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTA0OTksImV4cCI6MjA5NzI4NjQ5OX0.3qPGkA9tyvTDWqPQrBjJUnp9_PzNxBJQ-NCv2dUo2DE';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const SERVER = 'https://fx-tracking-server.onrender.com';
const STEPS = ['Received', 'Assessment', 'Quote', 'Repair', 'Testing', 'QC', 'Ready to ship', 'Shipped'];
const HOLD_REASONS = ['Waiting on customer approval', 'Waiting on parts from Sweden', 'Waiting on payment', 'Needs more diagnosis', 'Shop backlog', 'Other'];
const CLOCK_DAYS = 14;
const FIELDS = [
  ['customer_name', 'Customer'], ['email', 'Email'], ['phone', 'Phone'], ['address', 'Address'],
  ['model', 'Model'], ['serial_number', 'Serial #'], ['caliber', 'Caliber'], ['barrel_length', 'Barrel length'],
  ['warranty', 'Warranty'], ['freshdesk_ticket', 'Freshdesk #'], ['issue', 'What the customer told us']
];
const DAY = 86400000;

// ── STATE ───────────────────────────────────────────────
let me = '', tickets = [], records = [], view = 'list', listTab = 'queue', q = '', openRecordId = null, events = [];

// ── HELPERS ─────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function fmtDT(iso) { return iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
let toastT = null;
function toast(m, err) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 6000 : 2600); }
function nameOf(email) { const n = String(email || '').split('@')[0].split('.')[0]; return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; }
function dateToIso(d) { return d ? new Date(d + 'T12:00:00').toISOString() : null; }
function isoToDate(iso) { if (!iso) return ''; const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// "DRS MkII (.30)" → { model: 'DRS MkII', cal: '.30' }
function splitModel(m) { m = String(m || '').trim(); const k = m.match(/^(.*?)\s*\(([^)]*)\)\s*$/); return k ? { model: k[1].trim(), cal: k[2].trim() } : { model: m, cal: '' }; }
function rqWarranty(w) { w = String(w || '').toLowerCase(); return (w === 'warr' || w === 'warranty') ? 'Yes' : w === 'oop' ? 'No' : ''; }

// 14-day clock. Never pauses; stops when the rifle has shipped.
function clockOf(r) {
  if (!r || !r.received_at) return null;
  const start = new Date(r.received_at).getTime();
  const end = r.step === 'Shipped' && r.step_times && r.step_times.Shipped ? new Date(r.step_times.Shipped).getTime() : Date.now();
  const day = Math.max(1, Math.floor((end - start) / DAY) + 1);
  return { day, due: new Date(start + CLOCK_DAYS * DAY), late: day > CLOCK_DAYS, warn: day >= 10 && day <= CLOCK_DAYS, done: r.step === 'Shipped' };
}
function recordFor(t) { return records.find(r => String(r.repair_ticket_id) === String(t.id)); }

// ── DATA ────────────────────────────────────────────────
async function loadAll() {
  const [a, b] = await Promise.all([
    sb.from('repair_tickets').select('id,customer_name,ticket_number,model,serial_number,customer_email,customer_phone,customer_address,warranty,arrived_date,status,location,archived').eq('archived', false).order('id', { ascending: false }),
    sb.from('rr_records').select('*').order('created_at', { ascending: false })
  ]);
  if (a.error) throw a.error;
  if (b.error) throw b.error;
  tickets = a.data || []; records = b.data || [];
}
async function loadEvents(id) {
  const { data } = await sb.from('rr_events').select('*').eq('record_id', id).order('at', { ascending: false });
  events = data || [];
}
async function logEvent(recordId, kind, text, minutes) {
  try { await sb.from('rr_events').insert({ record_id: recordId, by_email: me, kind, text, minutes: minutes == null ? null : minutes }); } catch (e) {}
}

// ── LIST ────────────────────────────────────────────────
function render() { if (view === 'record') renderRecord(); else renderList(); }
function renderList() {
  view = 'list';
  const v = document.getElementById('view');
  v.innerHTML = `<div class="bar" style="justify-content:space-between;align-items:flex-end;">
      <div><h1>Repairs</h1><p class="lede">Test version. It reads the Repair Queue but never changes it.</p></div>
      <div class="bar"><button class="btn" onclick="openStandards()">Test standards</button><button class="btn primary" onclick="openNewTest()">New test repair</button></div></div>
    <div class="tabs">
      <button class="tab ${listTab === 'queue' ? 'on' : ''}" onclick="listTab='queue';renderList()">Repair Queue repairs</button>
      <button class="tab ${listTab === 'test' ? 'on' : ''}" onclick="listTab='test';renderList()">Test repairs</button>
    </div>
    <div class="filters"><input id="q" placeholder="Search ticket #, customer, model, serial" value="${esc(q)}" oninput="q=this.value;renderRows()"></div>
    <div id="rows"></div>`;
  renderRows();
}
function stepCell(r) {
  if (!r) return '<span class="pill">Not started</span>';
  const c = clockOf(r);
  let h = `<span class="pill step">${esc(r.step || 'Received')}</span>`;
  if (r.hold_reason) h += ` <span class="pill hold">On hold</span>`;
  if (c) h += ` <span class="pill ${c.late ? 'late' : ''}">${c.done ? c.day + ' days total' : 'Day ' + c.day + ' of ' + CLOCK_DAYS}</span>`;
  return h;
}
function renderRows() {
  const el = document.getElementById('rows'); if (!el) return;
  const s = q.trim().toLowerCase();
  const hit = (...xs) => !s || xs.join(' ').toLowerCase().includes(s);
  if (listTab === 'queue') {
    const list = tickets.filter(t => hit(t.ticket_number, t.customer_name, t.model, t.serial_number));
    if (!list.length) { el.innerHTML = '<div class="empty">No Repair Queue repairs match.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Ticket #</th><th>Customer</th><th>Model</th><th>Repair Queue</th><th>Repair Record</th></tr></thead><tbody>` +
      list.map(t => `<tr class="row" onclick="openFromTicket(${Number(t.id)})"><td class="num" style="font-size:19px;color:var(--teal);">#${esc(t.ticket_number || '—')}</td>
        <td>${esc(t.customer_name)}</td><td>${esc(t.model)}</td><td class="muted">${esc(t.status || '')}${t.location === 'nc' ? ' · Newman' : ''}</td><td>${stepCell(recordFor(t))}</td></tr>`).join('') + '</tbody></table>';
  } else {
    const list = records.filter(r => r.is_test && hit(r.freshdesk_ticket, r.customer_name, r.model, r.serial_number));
    if (!list.length) { el.innerHTML = '<div class="empty">No test repairs yet. Use “New test repair” to make one.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Freshdesk #</th><th>Customer</th><th>Model</th><th>Repair Record</th></tr></thead><tbody>` +
      list.map(r => `<tr class="row" onclick="openRecord('${r.id}')"><td class="num" style="font-size:19px;color:var(--teal);">${r.freshdesk_ticket ? '#' + esc(r.freshdesk_ticket) : '—'}</td>
        <td>${esc(r.customer_name)} <span class="pill test">TEST</span></td><td>${esc(r.model)}</td><td>${stepCell(r)}</td></tr>`).join('') + '</tbody></table>';
  }
}

// ── OPEN / CREATE ───────────────────────────────────────
async function openFromTicket(ticketId) {
  const t = tickets.find(x => Number(x.id) === Number(ticketId)); if (!t) return;
  let r = recordFor(t);
  if (!r) {
    const sm = splitModel(t.model);
    const row = {
      repair_ticket_id: t.id, is_test: false, freshdesk_ticket: String(t.ticket_number || '').replace(/[^0-9]/g, '') || null,
      customer_name: t.customer_name || null, email: t.customer_email || null, phone: t.customer_phone || null, address: t.customer_address || null,
      model: sm.model || null, serial_number: t.serial_number || null, caliber: sm.cal || null, warranty: rqWarranty(t.warranty) || null,
      received_at: dateToIso(t.arrived_date), created_by: me, step: 'Received'
    };
    const sources = {};
    Object.keys(row).forEach(k => { if (row[k] && FIELDS.some(f => f[0] === k)) sources[k] = 'Repair Queue'; });
    if (row.received_at) sources.received_at = 'Repair Queue';
    row.sources = sources;
    row.step_times = row.received_at ? { Received: row.received_at } : {};
    const { data, error } = await sb.from('rr_records').insert(row).select().single();
    if (error) { if (error.code === '23505') { await loadAll(); r = recordFor(t); } else return toast('Could not start the record: ' + error.message, true); }
    else { r = data; records.unshift(r); await logEvent(r.id, 'created', 'Repair Record started from Repair Queue card #' + (t.ticket_number || t.id)); prefill(r.id, true); }
  }
  openRecord(r.id);
}
function openNewTest() {
  document.getElementById('modal-body').innerHTML = `<h2>New test repair</h2>
    <p class="note">Only exists in this test app. Use a real Freshdesk ticket # to see page 1 fill itself.</p>
    <label class="l">Freshdesk ticket #<input id="n-ticket" placeholder="e.g. 34295"></label>
    <label class="l">Customer (optional if the ticket has it)<input id="n-cust"></label>

let prefillBusy = false;
async function prefill(id, quiet) {
  const r = records.find(x => x.id === id); if (!r || prefillBusy) return;
  prefillBusy = true; setPrefillStatus('Reading the Freshdesk ticket and the serial lookup… (can take up to a minute)');
  try {
    const { data: s } = await sb.auth.getSession();
    const token = s && s.session ? s.session.access_token : '';
    const known = {}; FIELDS.forEach(([k]) => { if (r[k]) known[k] = r[k]; });
    const res = await fetch(SERVER + '/repair-record-prefill', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ ticket: r.freshdesk_ticket || '', serial: r.serial_number || '', known }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'failed (' + res.status + ')');
    const cur = records.find(x => x.id === id) || r;
    const patch = {}, sources = Object.assign({}, cur.sources || {});
    const filled = [];
    Object.keys(out.fields || {}).forEach(k => {
      if (!FIELDS.some(f => f[0] === k)) return;
      const src = out.sources[k], val = out.fields[k];
      const edited = (sources[k] || '') === 'Edited';
      // Fill empty fields. Serial lookup beats other sources for model/caliber; the ticket decides warranty.
      const override = !edited && ((src === 'Serial lookup' && (k === 'model' || k === 'caliber')) || (k === 'warranty' && src === 'Freshdesk thread'));
      if ((!cur[k] || override) && String(cur[k] || '') !== val) { patch[k] = val; sources[k] = src; filled.push(k); }
    });
    if (Object.keys(patch).length) {
      patch.sources = sources;
      const { data, error } = await sb.from('rr_records').update(patch).eq('id', id).select().single();
      if (error) throw error;
      Object.assign(cur, data);
      await logEvent(id, 'prefill', 'Filled automatically: ' + filled.map(k => FIELDS.find(f => f[0] === k)[1]).join(', '));
    }
    const msg = (filled.length ? 'Filled ' + filled.length + ' field' + (filled.length > 1 ? 's' : '') + ' automatically.' : 'Nothing new to fill in.') + ((out.notes || []).length ? ' ' + out.notes.join(' ') : '');
    setPrefillStatus(msg);
    if (!quiet || filled.length) toast(filled.length ? 'Page 1 updated' : 'Nothing new to fill in');
  } catch (e) {
    setPrefillStatus('Could not fill automatically (' + e.message + '). You can type the details in.');
  } finally {
    prefillBusy = false;
    if (view === 'record' && openRecordId === id) renderRecord(true);
  }
}

let standards = [];

// ".30", "30", "0.30" → ".30";  "6.35mm" → "6.35"
function normCal(s) { const m = String(s || '').match(/\d*\.\d+|\d+/); if (!m) return ''; let c = m[0]; if (!c.includes('.')) c = '.' + c; c = c.replace(/^0+\./, '.'); return c; }

  if (std.es_max != null) parts.push('ES ≤ ' + std.es_max);
  if (std.sd_max != null) parts.push('SD ≤ ' + std.sd_max);
  return 'FX standard for ' + esc(std.model) + ' ' + esc(std.caliber) + (std.pellet ? ' with ' + esc(std.pellet) : '') + ': ' + parts.join(' · ');
}
function renderTesting(r) {
  const t = testsOf(r);
  let h = `<div class="bar" style="justify-content:space-between;"><span>${r.tested_at ? `Testing marked done by <b>${esc(nameOf(r.tested_by))}</b> on ${fmtDate(r.tested_at)}` : 'Drop the chrono screenshot on a string. The shots are read for you.'}</span><span class="note" id="as-status">Saves automatically</span></div>`;
  if (!t.strings.length) t.strings.push(newString());
  h += t.strings.map((s, i) => `<div class="card" id="str-${i}">${stringInner(r, s, i)}</div>`).join('');
  h += `<div><button class="btn" onclick="addString()">Add another string</button></div>`;
  const unassigned = photos.filter(p => p.section === 'Chrono' && !t.strings.some(s => s.photo === p.path));
  if (unassigned.length) h += `<div class="card"><h2>Screenshots from a phone</h2><p class="note">Pick which string each one belongs to. It is read automatically.</p><div class="phs">${unassigned.map(p => `<div style="display:flex;flex-direction:column;gap:6px;"><div class="ph"><img src="${esc(photoUrls[p.path] || '')}" alt="Chrono screenshot"></div>${t.strings.map((s, i) => `<button class="btn sm" onclick="useScreenshot('${p.id}',${i})">Use for string ${i + 1}</button>`).join('')}</div>`).join('')}</div></div>`;
  h += `<div class="card" id="acc">${accuracyInner(r)}</div>`;
  const ready = t.strings.some(s => stats(s.shots || []));
  h += `<div class="card" style="display:flex;flex-direction:column;gap:10px;"><b>Finish testing</b><span class="note">${ready ? 'Ready.' : 'Record at least one velocity string first.'}</span>
    <div class="bar"><button class="btn primary" id="t-done" ${ready ? '' : 'disabled'} onclick="finishTesting()">Testing done → QC</button></div></div>`;
  return h;
}
function newString() { return { id: Math.random().toString(36).slice(2, 8), pellet: '', grains: '', reg_bar: '', power: '', shots: [], unsure: [], photo: null }; }
function stringInner(r, s, i) {
  const std = standardFor(r, s.pellet), st = stats(s.shots || [], s.grains || (std && std.grains)), v = verdict(st, std);
  const n = Math.max(10, (s.shots || []).length);
  const shotIn = Array.from({ length: n }, (_, k) => `<label class="shot ${(s.unsure || []).includes(k) ? 'unsure' : ''}">Shot ${k + 1}<input inputmode="decimal" value="${esc((s.shots || [])[k] ?? '')}" oninput="setShot(${i},${k},this.value)" aria-label="String ${i + 1} shot ${k + 1}"></label>`).join('');
  return `<div class="bar" style="justify-content:space-between;"><h2>Velocity test · String ${i + 1}</h2>${r.tests.strings.length > 1 ? `<button class="btn sm ghost" onclick="removeString(${i})">Remove string</button>` : ''}</div>
    <p class="note" style="margin:4px 0 10px;">${stdText(std)}</p>
    <div class="strrow">
      <div class="shotpic">${s.photo ? `<a href="${esc(photoUrls[s.photo] || '#')}" target="_blank" rel="noopener"><img src="${esc(photoUrls[s.photo] || '')}" alt="Chronograph screenshot for string ${i + 1}"></a>` : ''}
        <div class="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');chronoFile(${i},event.dataTransfer.files[0])">
          ${s.photo ? 'Replace:' : 'Drop the chrono screenshot here, or'} <label class="btn sm">Choose<input type="file" accept="image/*" hidden onchange="chronoFile(${i},this.files[0]);this.value=''"></label>
          <button class="btn sm" onclick="phoneQr('Chrono')">From phone</button></div>
        <span class="note" id="rd-${i}">${esc(s.readNote || '')}</span></div>
      <div style="flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px;">
        <div class="grid4">
          <label class="l">Pellet<input value="${esc(s.pellet || '')}" oninput="setStr(${i},'pellet',this.value,true)" placeholder="${esc(std && std.pellet || 'e.g. JSB Exact 44.75')}"></label>
          <label class="l">Weight (gr)<input inputmode="decimal" value="${esc(s.grains || '')}" oninput="setStr(${i},'grains',this.value,true)" placeholder="${esc(std && std.grains || '')}"></label>
          <label class="l">Regulator (bar)<input inputmode="decimal" value="${esc(s.reg_bar || '')}" oninput="setStr(${i},'reg_bar',this.value)"></label>
          <label class="l">Power setting<input value="${esc(s.power || '')}" oninput="setStr(${i},'power',this.value)"></label></div>
        <div class="shots">${shotIn}</div>
        ${(s.unsure || []).length ? '<span class="note" style="color:var(--warn);">Highlighted shots were hard to read on the screenshot. Please check them.</span>' : ''}
        <div><button class="btn sm ghost" onclick="addShot(${i})">Add a shot</button></div>
        <div class="statrow" id="stats-${i}">${statsHtml(st, v)}</div></div></div>`;
}
function statsHtml(st, v) {
  if (!st) return '<span class="note">Enter or read the shots to see the results.</span>';
  const cell = (k, val, sub, col) => `<div class="stat"><span class="note">${k}</span><b class="num" style="color:${col || 'var(--text)'}">${val}</b><span class="note">${sub}</span></div>`;
  const good = 'var(--teal-soft)', bad = 'var(--red)';
  const ck = k => !v || v.pass == null ? undefined : (v.checks.find(c => c.k === k) || { ok: true }).ok ? good : bad;
  return cell('Average', st.avg.toFixed(1), 'fps · ' + st.n + ' shots', ck('Average')) + cell('Extreme spread', st.es.toFixed(1).replace(/\.0$/, ''), 'fps', ck('ES')) +
    cell('Std deviation', st.sd.toFixed(1), 'fps', ck('SD')) + cell('Energy', st.fpe == null ? '—' : st.fpe.toFixed(1), st.fpe == null ? 'add pellet weight' : 'ft·lb') +
    cell('Result', v.pass == null ? '—' : v.pass ? 'Pass' : 'Fail', v.pass == null ? v.label : v.pass ? 'vs FX standard' : v.label.replace('Fail: ', 'out of range: '), v.pass == null ? undefined : v.pass ? good : bad);
}
function redrawStats(i) { const r = curRec(), s = testsOf(r).strings[i], el = document.getElementById('stats-' + i); if (!el || !s) return; const std = standardFor(r, s.pellet); const st = stats(s.shots || [], s.grains || (std && std.grains)); el.innerHTML = statsHtml(st, verdict(st, std)); const b = document.getElementById('t-done'); if (b) b.disabled = !testsOf(r).strings.some(x => stats(x.shots || [])); }
function redrawString(i) { const r = curRec(), el = document.getElementById('str-' + i); if (el) el.innerHTML = stringInner(r, testsOf(r).strings[i], i); redrawStats(i); }
function setShot(i, k, val) { const s = testsOf(curRec()).strings[i]; s.shots = s.shots || []; s.shots[k] = String(val).trim() === '' ? null : String(val).trim(); while (s.shots.length && (s.shots[s.shots.length - 1] == null)) s.shots.pop(); s.unsure = (s.unsure || []).filter(x => x !== k); scheduleSave(); redrawStats(i); }
function setStr(i, key, val, stdAffects) { const s = testsOf(curRec()).strings[i]; s[key] = val; scheduleSave(); if (stdAffects) redrawStats(i); }
function addShot(i) { const s = testsOf(curRec()).strings[i]; const n = Math.max(10, (s.shots || []).length); s.shots = (s.shots || []).concat(Array(n + 1 - (s.shots || []).length).fill(null)); redrawString(i); }
function addString() { testsOf(curRec()).strings.push(newString()); scheduleSave(); renderRecord(true); }
function removeString(i) { if (!confirm('Remove string ' + (i + 1) + '?')) return; testsOf(curRec()).strings.splice(i, 1); scheduleSave(); renderRecord(true); }
function blobToBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = rej; fr.readAsDataURL(blob); }); }
async function chronoFile(i, file) {
  if (!file) return;
  const r = curRec(), s = testsOf(r).strings[i];
  const msg = document.getElementById('rd-' + i); if (msg) msg.textContent = 'Uploading and reading the shots…';
  try {
    const blob = await resizeImage(file);
    const path = `${r.id}/Chrono/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
    const up = await sb.storage.from('rr-photos').upload(path, blob, { contentType: 'image/jpeg' }); if (up.error) throw up.error;
    const ins = await sb.from('rr_photos').insert({ record_id: r.id, section: 'Chrono', path, caption: 'String ' + (i + 1), uploaded_by: me }); if (ins.error) throw ins.error;
    s.photo = path; await loadPhotos(r.id);
    await readInto(i, await blobToBase64(blob));
  } catch (e) { s.readNote = 'Could not read it (' + (e.message || e) + '). Type the shots in.'; scheduleSave(); redrawString(i); }
}
async function useScreenshot(photoId, i) {
  const r = curRec(), p = photos.find(x => x.id === photoId), s = testsOf(r).strings[i]; if (!p || !s) return;
  s.photo = p.path; scheduleSave(); renderRecord(true);
  const msg = document.getElementById('rd-' + i); if (msg) msg.textContent = 'Reading the shots…';
  try { const blob = await (await fetch(photoUrls[p.path])).blob(); await readInto(i, await blobToBase64(blob)); }
  catch (e) { s.readNote = 'Could not read it (' + (e.message || e) + '). Type the shots in.'; scheduleSave(); redrawString(i); }
}
async function readInto(i, dataUrl) {
  const r = curRec(), s = testsOf(r).strings[i];
  const { data: ss } = await sb.auth.getSession();
  const res = await fetch(SERVER + '/read-chrono', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (ss && ss.session ? ss.session.access_token : '') },
    body: JSON.stringify({ image_base64: dataUrl, media_type: 'image/jpeg' }) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || 'failed (' + res.status + ')');
  if (!out.shots || !out.shots.length) { s.readNote = 'No shots found on that screenshot' + (out.note ? ' (' + out.note + ')' : '') + '. Type them in.'; }
  else {
    const had = (s.shots || []).some(x => x != null && x !== '');
    if (!had || confirm('Replace the shots already typed in with the ones read from the screenshot?')) {
      s.shots = out.shots.map(String); s.unsure = out.unsure || [];
      s.readNote = 'Read ' + out.shots.length + ' shots' + (out.device ? ' from ' + out.device : '') + (out.converted ? ' (converted from m/s)' : '') + '. Please check them.';
      await logEvent(r.id, 'test', 'String ' + (i + 1) + ': ' + out.shots.length + ' shots read from the chrono screenshot');
    }
  }
  scheduleSave(); redrawString(i);
}
function accuracyInner(r) {
  const a = testsOf(r).accuracy, std = standardFor(r, (testsOf(r).strings[0] || {}).pellet);
  const g = Number(a.group_in), lim = std && std.acc_group_in != null ? Number(std.acc_group_in) : null;
  const res = a.group_in && lim != null ? (g <= lim ? '<b style="color:var(--teal-soft)">Within FX standard</b>' : '<b style="color:var(--red)">Outside FX standard</b>') : a.group_in ? '<span class="note">No accuracy standard yet</span>' : '';
  return `<h2>Accuracy test <span class="note" style="font-weight:400;">${std && std.acc_group_in != null ? 'FX standard: ' + esc(std.acc_group_in) + ' in at ' + esc(std.acc_distance_yd ?? '?') + ' yd' : '(optional)'}</span></h2>
    <div class="grid4" style="margin-top:8px;">
      <label class="l">Distance (yd)<input inputmode="decimal" value="${esc(a.distance_yd || '')}" oninput="setAcc('distance_yd',this.value)"></label>
      <label class="l">Shots<input inputmode="numeric" value="${esc(a.shots || '')}" oninput="setAcc('shots',this.value)"></label>
      <label class="l">Group size (in, center to center)<input inputmode="decimal" value="${esc(a.group_in || '')}" oninput="setAcc('group_in',this.value)"></label>
      <div class="l">Result<div id="acc-res" style="padding-top:8px;">${res}</div></div></div>
    ${photoBlock('Target', 'Target photo')}`;
}
function setAcc(k, v) { const r = curRec(); testsOf(r).accuracy[k] = v; scheduleSave(); if (k === 'group_in') { const el = document.getElementById('acc'); const y = window.scrollY; if (el) { const f = document.activeElement && document.activeElement.getAttribute('oninput'); el.innerHTML = accuracyInner(r); const again = f && el.querySelector(`[oninput="${f}"]`); if (again) { again.focus(); const L = again.value.length; try { again.setSelectionRange(L, L); } catch (e) {} } window.scrollTo(0, y); } } }
async function finishTesting() {
  const r = curRec(); if (!r) return;
  if (saveTimer) { clearTimeout(saveTimer); await saveAssessment(); }
  const patch = { tested_by: me, tested_at: new Date().toISOString() };
  if (Math.max(0, STEPS.indexOf(r.step)) < STEPS.indexOf('QC')) { const st = Object.assign({}, r.step_times || {}); st.Testing = st.Testing || patch.tested_at; st.QC = patch.tested_at; patch.step = 'QC'; patch.step_times = st; }
  if (await patchRecord(patch)) { await logEvent(r.id, 'step', 'Testing done' + (patch.step ? ', moved to QC' : '')); await loadEvents(r.id); renderRecord(true); toast('Testing marked done'); }
}

// ── TEST STANDARDS PAGE ─────────────────────────────────
const STD_COLS = [['model', 'Model', 'e.g. DRS MkII'], ['caliber', 'Caliber', '.30'], ['pellet', 'Pellet (blank = any)', ''], ['grains', 'Grains', ''], ['fps_min', 'Min fps', ''], ['fps_max', 'Max fps', ''],
  ['es_max', 'Max ES', ''], ['sd_max', 'Max SD', ''], ['acc_distance_yd', 'Accuracy yd', ''], ['acc_group_in', 'Max group (in)', ''], ['notes', 'Notes', '']];
const STD_NUM = ['grains', 'fps_min', 'fps_max', 'es_max', 'sd_max', 'acc_distance_yd', 'acc_group_in'];
async function openStandards() { view = 'standards'; openRecordId = null; await loadStandards(); renderStandards(); }
function renderStandards() {
  const v = document.getElementById('view');
  v.innerHTML = `<a href="#" onclick="backToList();return false;" style="color:var(--teal);font-size:13px;text-decoration:none;">← Repairs</a>
    <h1>Test standards</h1><p class="lede">One row per model and caliber (and pellet if it matters). Pass/fail on the Testing tab uses these. Changes save as you type.</p>
    <div style="overflow-x:auto;"><table class="stdt"><thead><tr>${STD_COLS.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>
    ${standards.map(s => `<tr>${STD_COLS.map(([k, , ph]) => `<td><input value="${esc(s[k] ?? '')}" placeholder="${esc(ph)}" ${STD_NUM.includes(k) ? 'inputmode="decimal"' : ''} onchange="saveStd('${s.id}','${k}',this.value)" aria-label="${k}"></td>`).join('')}<td><button class="btn sm ghost" onclick="deleteStd('${s.id}')">Delete</button></td></tr>`).join('')
      || `<tr><td colspan="${STD_COLS.length + 1}" class="muted" style="padding:20px;">No standards yet.</td></tr>`}
    </tbody></table></div><div style="margin-top:12px;"><button class="btn primary" onclick="addStd()">Add a standard</button></div>`;
}
async function addStd() { const { error } = await sb.from('rr_standards').insert({ model: 'New model', caliber: '', updated_by: me }); if (error) return toast('Could not add: ' + error.message, true); await loadStandards(); renderStandards(); }
async function saveStd(id, k, val) {
  val = String(val).trim(); let v2 = val === '' ? null : val;
  if (STD_NUM.includes(k) && v2 != null) { v2 = Number(v2); if (!isFinite(v2)) return toast('Please enter a number.', true); }
  if ((k === 'model' || k === 'caliber') && v2 == null) v2 = '';
  const { error } = await sb.from('rr_standards').update({ [k]: v2, updated_by: me, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) toast('Could not save: ' + error.message, true); else { const s = standards.find(x => x.id === id); if (s) s[k] = v2; toast('Saved'); }
}
async function deleteStd(id) { if (!confirm('Delete this standard?')) return; await sb.from('rr_standards').delete().eq('id', id); await loadStandards(); renderStandards(); }

// ── LIVE UPDATES ────────────────────────────────────────
let liveT = null;
function typing() { const a = document.activeElement; return a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && a.id !== 'q'; }
function subscribeLive() {
  sb.channel('rr-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_records' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_events' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'repair_tickets' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_standards' }, async () => { await loadStandards(); if (view === 'standards' && !typing()) renderStandards(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_photos' }, async p => {
      const rid = (p.new && p.new.record_id) || (p.old && p.old.record_id);
      if (openRecordId && (!rid || rid === openRecordId)) { await loadPhotos(openRecordId); refreshPhotoAreas(); }
    })
    .subscribe();
}
function onLive() { clearTimeout(liveT); liveT = setTimeout(liveApply, 800); }
async function liveApply() {
  if (view === 'phone' || view === 'standards') return;
  if (typing() || saveTimer || saving || document.getElementById('modal').classList.contains('open')) { liveT = setTimeout(liveApply, 1500); return; }
  try { await loadAll(); if (openRecordId) await loadEvents(openRecordId); } catch (e) { return; }
  if (view === 'record') renderRecord(true); else renderRows();
}

// ── AUTH ────────────────────────────────────────────────
let launched = false;
async function launch() {
  if (launched) return; launched = true;
  try { await loadAll(); } catch (e) { document.getElementById('view').innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '. Has 12-repair-record.sql been run?</div>'; return; }
  subscribeLive();
  if (phoneParams()) renderPhone(); else renderList();
}
function onSession(s) {
  if (s) { document.getElementById('auth').classList.add('hidden'); me = (s.user.email || '').toLowerCase(); document.getElementById('user-email').textContent = me; setTimeout(launch, 0); }
  else document.getElementById('auth').classList.remove('hidden');
}
sb.auth.onAuthStateChange((_e, s) => onSession(s));
sb.auth.getSession().then(({ data }) => onSession(data.session));
async function signIn() {
  const email = document.getElementById('auth-email').value.trim(), password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-err'); err.textContent = '';
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) err.textContent = 'Login failed. Check your email and password.';
}
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
async function signOut() { await sb.auth.signOut(); location.reload(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
