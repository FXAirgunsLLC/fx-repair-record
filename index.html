<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Repair Record (test)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1214;--surface:#171b1f;--raised:#1f2429;--line:#2c3238;--line2:#3a4148;
  --text:#e6e8eb;--muted:#a3abb5;--dim:#8b939d;
  --teal:#50c8c0;--teal-dk:#1f3535;--teal-soft:#7fdcd6;
  --warn:#f2c94c;--warn-soft:rgba(242,201,76,.14);
  --red:#e27b6b;--red-soft:rgba(226,123,107,.14);
  --blue:#6fa9e6;--blue-soft:rgba(111,169,230,.14);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0f1214}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;height:56px}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.testtag{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--warn);color:#1a1608;border-radius:4px;padding:2px 7px}
.top .grow{flex:1}
.user{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
main{max-width:1360px;margin:0 auto;padding:22px 24px 60px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1.1}
h2{font-size:15px;font-weight:700}
.lede{color:var(--muted);margin:4px 0 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{min-height:42px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--text);box-shadow:inset 0 -3px 0 var(--teal)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input{max-width:340px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap;background:var(--raised);color:var(--muted)}
.pill.step{background:var(--teal-dk);color:var(--teal-soft)}
.pill.hold{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--red-soft);color:var(--red)}
.pill.test{background:var(--warn);color:#1a1608}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{display:flex;flex-direction:column;padding:8px 12px;border-radius:6px;min-width:108px;background:#1a1e22;color:var(--muted);border:1px solid var(--line)}
.stage b{font-size:13px}
.stage span{font-size:11px;opacity:.9}
.stage.done{background:var(--teal-dk);color:var(--teal-soft);border-color:#2f5a57}
.stage.now{background:var(--teal);color:#0f1214;border-color:var(--teal)}
.clock{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.track{flex:1 1 260px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.track div{height:100%;background:var(--teal)}
.track.late div{background:var(--red)}
.track.warn div{background:var(--warn)}
.layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;margin-top:18px}
.mainc{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side{flex:1 1 320px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.f .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.f .src{font-size:11px;color:var(--teal-soft)}
.f.miss{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:8px 10px;margin:4px -10px}
.f.miss .src{color:var(--warn);font-weight:700}
.f input,.f textarea,.f select{background:transparent;border:1px solid transparent;padding:4px 6px;margin-left:-6px;font-weight:600}
.f input:hover,.f textarea:hover,.f select:hover{border-color:var(--line2)}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal);background:var(--bg)}
.f textarea{min-height:64px;font-weight:500}
.soon{border:1px dashed var(--line2);border-radius:8px;padding:22px;color:var(--muted);text-align:center}
.hist li{list-style:none;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--dim);font-size:12px}
.holdbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--dim)}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.modal-wrap.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:10px;width:min(560px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;display:none;max-width:90vw}
#toast.show{display:block}
#toast.err{border-color:var(--red);color:var(--red)}
#auth{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
#auth.hidden{display:none}
.auth-box{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:30px;width:320px;display:flex;flex-direction:column;gap:10px}
.auth-err{color:var(--red);font-size:12px;min-height:14px;text-align:center}
/* Assessment */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sec.open{border-color:var(--teal)}
.sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:transparent;border:0;color:var(--text);text-align:left;min-height:48px}
.sec.open .sec-h{background:var(--raised)}
.sec-b{padding:6px 16px 16px;display:flex;flex-direction:column;gap:6px}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow.miss .alab::after{content:' •';color:var(--warn)}
.alab{width:230px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:#c5cbd2;font-size:13px}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--teal);border-color:var(--teal);color:#0f1214;font-weight:700}
.mini{width:110px;padding:6px 8px}
input.need{border-color:var(--warn);background:var(--warn-soft)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:8px}
.find{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.btn.teal{border-color:var(--teal);background:var(--teal-dk);color:var(--teal-soft)}
.prow{display:flex;gap:8px;margin-bottom:6px}
.phwrap{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:120px;height:90px;border-radius:6px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
.drop{border:1px dashed var(--line2);border-radius:6px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--teal);background:var(--teal-dk)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.strrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.shotpic{flex:0 0 240px;display:flex;flex-direction:column;gap:8px}
.shotpic img{width:100%;max-height:220px;object-fit:contain;border-radius:6px;background:var(--line)}
.shots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.shot{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-align:center}
.shot input{text-align:center;padding:6px 2px;font-size:14px;font-weight:600}
.shot.unsure input{border:2px solid var(--warn);background:var(--warn-soft)}
.statrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{background:var(--raised);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-size:26px;line-height:1.1}
.stdt input{min-width:90px;padding:6px 8px}
.stdt td{padding:6px 4px}
/* Install 4: tech's call, QC, Service Report */
.callrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.opt.pass.on{background:var(--teal);border-color:var(--teal);color:#0f1214}
.opt.fail.on{background:var(--red);border-color:var(--red);color:#0f1214}
.qcrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.qcrow input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--teal)}
.sentbox{background:var(--teal-dk);border:1px solid #2f5a57;border-radius:8px;padding:12px 14px;color:var(--teal-soft)}
.repwrap{background:#5a6168;border-radius:8px;padding:18px;overflow:auto;max-height:80vh}
.rep{background:#fff;color:#1b1f23;width:780px;margin:0 auto;padding:34px 40px;font-family:Inter,Arial,sans-serif;font-size:11.5px;line-height:1.45}
.rep h3{font-size:13px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid #1b1f23;text-transform:uppercase;letter-spacing:.05em}
.rep h4{font-size:12px;margin:10px 0 4px}
.rep table{width:100%;border-collapse:collapse}
.rep td,.rep th{padding:4px 6px;border-bottom:1px solid #d9dde1;text-align:left;vertical-align:top;color:#1b1f23;font-size:11px}
.rep th{background:#eef0f2;font-weight:700;color:#3a4148}
.rep .rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1b1f23;padding-bottom:10px}
.rep .rtitle{font-family:'Barlow Condensed',Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:.04em}
.rep .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px}
.rep .kv div{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #eceef0}
.rep .kv b{min-width:110px;color:#5a6168;font-weight:600}
.rep .say{background:#f4f6f7;border-left:3px solid #50c8c0;padding:6px 10px;margin:6px 0}
.rep .ok{color:#1d7a6f;font-weight:700}.rep .bad{color:#b23b2a;font-weight:700}
.rep .pics{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rep .pics img{width:150px;height:112px;object-fit:cover;border-radius:3px;border:1px solid #d9dde1}
.rep .sig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:8px}
.rep .sig div{border-top:1px solid #1b1f23;padding-top:4px}
.rep .foot{margin-top:18px;padding-top:8px;border-top:1px solid #d9dde1;color:#5a6168;font-size:10px}
.rep-avoid{page-break-inside:avoid;break-inside:avoid}
@media(max-width:760px){.grid3{grid-template-columns:1fr}.alab{width:100%}.grid4{grid-template-columns:1fr 1fr}.shots{grid-template-columns:repeat(5,minmax(0,1fr))}.statrow{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const FIELDS = [
  ['customer_name', 'Customer'], ['email', 'Email'], ['phone', 'Phone'], ['address', 'Address'],
  ['model', 'Model'], ['serial_number', 'Serial #'], ['caliber', 'Caliber'], ['barrel_length', 'Barrel length'],
  ['warranty', 'Warranty'], ['freshdesk_ticket', 'Freshdesk #'], ['issue', 'What the customer told us']
];
const DAY = 86400000;

// ── STATE ───────────────────────────────────────────────
let me = '', tickets = [], records = [], view = 'list', listTab = 'queue', q = '', openRecordId = null, events = [], options = [], otherFor = null;

// ── HELPERS ─────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function fmtDT(iso) { return iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
let toastT = null;
function toast(m, err) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 6000 : 2600); }
function nameOf(email) { const n = String(email || '').split('@')[0].split('.')[0]; return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; }
function fullName(email) { const p = String(email || '').split('@')[0].split(/[._-]+/).filter(Boolean); return p.map(x => x.charAt(0).toUpperCase() + x.slice(1)).join(' '); }
function dateToIso(d) { return d ? new Date(d + 'T12:00:00').toISOString() : null; }
function isoToDate(iso) { if (!iso) return ''; const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// "DRS MkII (.30)" → { model: 'DRS MkII', cal: '.30' }
function splitModel(m) { m = String(m || '').trim(); const k = m.match(/^(.*?)\s*\(([^)]*)\)\s*$/); return k ? { model: k[1].trim(), cal: k[2].trim() } : { model: m, cal: '' }; }
function rqWarranty(w) { w = String(w || '').toLowerCase(); return (w === 'warr' || w === 'warranty') ? 'Yes' : w === 'oop' ? 'No' : ''; }

// 14-day clock. Never pauses; stops when the rifle has shipped.
function clockOf(r) {
  if (!r || !r.received_at) return null;
  const start = new Date(r.received_at).getTime();
  const end = r.step === 'Shipped' && r.step_times && r.step_times.Shipped ? new Date(r.step_times.Shipped).getTime() : Date.now();
  const day = Math.max(1, Math.floor((end - start) / DAY) + 1);
  return { day, due: new Date(start + CLOCK_DAYS * DAY), late: day > CLOCK_DAYS, warn: day >= 10 && day <= CLOCK_DAYS, done: r.step === 'Shipped' };
}
function recordFor(t) { return records.find(r => String(r.repair_ticket_id) === String(t.id)); }

// ── DATA ────────────────────────────────────────────────
async function loadAll() {
  const [a, b] = await Promise.all([
    sb.from('repair_tickets').select('id,customer_name,ticket_number,model,serial_number,customer_email,customer_phone,customer_address,warranty,arrived_date,status,location,archived').eq('archived', false).order('id', { ascending: false }),
    sb.from('rr_records').select('*').order('created_at', { ascending: false })
  ]);
  if (a.error) throw a.error;
  if (b.error) throw b.error;
  tickets = a.data || []; records = b.data || [];
  const o = await sb.from('rr_options').select('*').order('sort', { ascending: true }).order('value', { ascending: true });
  options = o.error ? [] : (o.data || []);
}
async function loadEvents(id) {
  const { data } = await sb.from('rr_events').select('*').eq('record_id', id).order('at', { ascending: false });
  events = data || [];
}
async function logEvent(recordId, kind, text, minutes) {
  try { await sb.from('rr_events').insert({ record_id: recordId, by_email: me, kind, text, minutes: minutes == null ? null : minutes }); } catch (e) {}
}

// ── LIST ────────────────────────────────────────────────
function render() { if (view === 'record') renderRecord(); else renderList(); }
function renderList() {
  view = 'list';
  const v = document.getElementById('view');
  v.innerHTML = `<div class="bar" style="justify-content:space-between;align-items:flex-end;">
      <div><h1>Repairs</h1><p class="lede">Test version. It reads the Repair Queue but never changes it.</p></div>
      <div class="bar">${STANDARDS_ON ? '<button class="btn" onclick="openStandards()">Test standards</button>' : ''}<button class="btn primary" onclick="openNewTest()">New test repair</button></div></div>
    <div class="tabs">
      <button class="tab ${listTab === 'queue' ? 'on' : ''}" onclick="listTab='queue';renderList()">Repair Queue repairs</button>
      <button class="tab ${listTab === 'test' ? 'on' : ''}" onclick="listTab='test';renderList()">Test repairs</button>
    </div>
    <div class="filters"><input id="q" placeholder="Search ticket #, customer, model, serial" value="${esc(q)}" oninput="q=this.value;renderRows()"></div>
    <div id="rows"></div>`;
  renderRows();
}
function stepCell(r) {
  if (!r) return '<span class="pill">Not started</span>';
  const c = clockOf(r);
  let h = `<span class="pill step">${esc(r.step || 'Received')}</span>`;
  if (r.hold_reason) h += ` <span class="pill hold">On hold</span>`;
  if (c) h += ` <span class="pill ${c.late ? 'late' : ''}">${c.done ? c.day + ' days total' : 'Day ' + c.day + ' of ' + CLOCK_DAYS}</span>`;
  return h;
}
function renderRows() {
  const el = document.getElementById('rows'); if (!el) return;
  const s = q.trim().toLowerCase();
  const hit = (...xs) => !s || xs.join(' ').toLowerCase().includes(s);
  if (listTab === 'queue') {
    const list = tickets.filter(t => hit(t.ticket_number, t.customer_name, t.model, t.serial_number));
    if (!list.length) { el.innerHTML = '<div class="empty">No Repair Queue repairs match.</div>'; return; }

async function openFromTicket(ticketId) {
  const t = tickets.find(x => Number(x.id) === Number(ticketId)); if (!t) return;
  let r = recordFor(t);
  if (!r) {
    const sm = splitModel(t.model);
    const row = {
      repair_ticket_id: t.id, is_test: false, freshdesk_ticket: String(t.ticket_number || '').replace(/[^0-9]/g, '') || null,
      customer_name: t.customer_name || null, email: t.customer_email || null, phone: t.customer_phone || null, address: t.customer_address || null,
      model: sm.model || null, serial_number: t.serial_number || null, caliber: sm.cal || null, warranty: rqWarranty(t.warranty) || null,
      received_at: dateToIso(t.arrived_date), created_by: me, step: 'Received'
    };
    const sources = {};
    Object.keys(row).forEach(k => { if (row[k] && FIELDS.some(f => f[0] === k)) sources[k] = 'Repair Queue'; });
    if (row.received_at) sources.received_at = 'Repair Queue';
    row.sources = sources;
    row.step_times = row.received_at ? { Received: row.received_at } : {};
    const { data, error } = await sb.from('rr_records').insert(row).select().single();
    if (error) { if (error.code === '23505') { await loadAll(); r = recordFor(t); } else return toast('Could not start the record: ' + error.message, true); }
    else { r = data; records.unshift(r); await logEvent(r.id, 'created', 'Repair Record started from Repair Queue card #' + (t.ticket_number || t.id)); prefill(r.id, true); }
  }
  openRecord(r.id);
}

// ── PREFILL (Freshdesk + AI + serial lookup) ────────────
let prefillBusy = false;
async function prefill(id, quiet) {
  const r = records.find(x => x.id === id); if (!r || prefillBusy) return;
  prefillBusy = true; setPrefillStatus('Reading the Freshdesk ticket and the serial lookup… (can take up to a minute)');
  try {
    const { data: s } = await sb.auth.getSession();
    const token = s && s.session ? s.session.access_token : '';
    const known = {}; FIELDS.forEach(([k]) => { if (r[k]) known[k] = r[k]; });
    const res = await fetch(SERVER + '/repair-record-prefill', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ ticket: r.freshdesk_ticket || '', serial: r.serial_number || '', known }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'failed (' + res.status + ')');
    const cur = records.find(x => x.id === id) || r;
    const patch = {}, sources = Object.assign({}, cur.sources || {});
    const filled = [];
    Object.keys(out.fields || {}).forEach(k => {
      if (!FIELDS.some(f => f[0] === k)) return;
      const src = out.sources[k], val = out.fields[k];
      const edited = (sources[k] || '') === 'Edited';
      // Fill empty fields. Serial lookup beats other sources for model/caliber; the ticket decides warranty.
      const override = !edited && ((src === 'Serial lookup' && (k === 'model' || k === 'caliber')) || (k === 'warranty' && src === 'Freshdesk thread'));
      if ((!cur[k] || override) && String(cur[k] || '') !== val) { patch[k] = val; sources[k] = src; filled.push(k); }
    });
    if (Object.keys(patch).length) {
      patch.sources = sources;
      const { data, error } = await sb.from('rr_records').update(patch).eq('id', id).select().single();
      if (error) throw error;
      Object.assign(cur, data);
      await logEvent(id, 'prefill', 'Filled automatically: ' + filled.map(k => FIELDS.find(f => f[0] === k)[1]).join(', '));
    }
    const msg = (filled.length ? 'Filled ' + filled.length + ' field' + (filled.length > 1 ? 's' : '') + ' automatically.' : 'Nothing new to fill in.') + ((out.notes || []).length ? ' ' + out.notes.join(' ') : '');
    setPrefillStatus(msg);
    if (!quiet || filled.length) toast(filled.length ? 'Page 1 updated' : 'Nothing new to fill in');
  } catch (e) {
    setPrefillStatus('Could not fill automatically (' + e.message + '). You can type the details in.');
  } finally {
    prefillBusy = false;
    if (view === 'record' && openRecordId === id) renderRecord(true);
  }
}

function setPrefillStatus(m) { prefillMsg = m; const el = document.getElementById('prefill-status'); if (el) el.textContent = m; }

function fieldHtml(r, k, label) {
  const src = (r.sources || {})[k === '__received' ? 'received_at' : k] || '';
  const val = k === '__received' ? isoToDate(r.received_at) : (r[k] || '');
  const miss = !val && k !== 'address';   // address may legitimately be blank
  const tag = miss ? 'Needs you' : src;
  let input;
  if (k === 'warranty') input = `<select onchange="saveField('${k}', this.value)"><option value="">— Not set —</option><option ${val === 'Yes' ? 'selected' : ''}>Yes</option><option ${val === 'No' ? 'selected' : ''}>No</option></select>`;
  else if (k === 'issue') input = `<textarea onchange="saveField('${k}', this.value)" placeholder="Customer-facing summary of the problem">${esc(val)}</textarea>`;
  else if (k === '__received') input = `<input type="date" value="${esc(val)}" onchange="setReceived(this.value)">`;
  else if (PICK_FIELDS[k] && otherFor === k) input = `<input id="other-${k}" value="" placeholder="Type the ${esc(label.toLowerCase())}, then press Enter" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){otherFor=null;renderRecord(true);}" onblur="saveOther('${k}', this.value)">`;
  else if (PICK_FIELDS[k]) {
    const list = options.filter(o => o.kind === PICK_FIELDS[k]).map(o => o.value);
    const has = val && list.some(x => x.toLowerCase() === String(val).toLowerCase());
    input = `<select onchange="pickField('${k}', this.value)"><option value="">— Not set —</option>${val && !has ? `<option selected>${esc(val)}</option>` : ''}${list.map(x => `<option ${String(val).toLowerCase() === x.toLowerCase() ? 'selected' : ''}>${esc(x)}</option>`).join('')}<option value="__other">Other…</option></select>`;
  }
  else input = `<input value="${esc(val)}" onchange="saveField('${k}', this.value)" placeholder="Not found">`;
  return `<div class="f ${miss ? 'miss' : ''}"><div class="lab"><span>${esc(label)}</span><span class="src">${esc(tag)}</span></div>${input}</div>`;
}
function pickField(k, v) {
  if (v === '__other') { otherFor = k; renderRecord(true); setTimeout(() => { const el = document.getElementById('other-' + k); if (el) el.focus(); }, 0); return; }
  saveField(k, v);
}
async function saveOther(k, v) {
  if (otherFor !== k) return;
  otherFor = null;
  v = String(v || '').trim();
  if (!v) { renderRecord(true); return; }
  const kind = PICK_FIELDS[k];
  if (!options.some(o => o.kind === kind && o.value.toLowerCase() === v.toLowerCase())) {
    // Add it to the shared list so the next repair can pick it
    const { data } = await sb.from('rr_options').insert({ kind, value: v, added_by: me }).select().single();
    if (data) options.push(data);
  }
  await saveField(k, v);
  renderRecord(true);
}

async function patchRecord(patch) {
  const r = records.find(x => x.id === openRecordId); if (!r) return null;
  const { data, error } = await sb.from('rr_records').update(patch).eq('id', r.id).select().single();
  if (error) { toast('Could not save: ' + error.message, true); return null; }
  Object.assign(r, data); return r;
}
async function saveField(k, value) {
  const r = records.find(x => x.id === openRecordId); if (!r) return;
  value = String(value || '').trim() || null;
  if ((r[k] || null) === value) return;
  const sources = Object.assign({}, r.sources || {}); sources[k] = 'Edited';
  const old = r[k];
  if (await patchRecord({ [k]: value, sources })) {
    const label = (FIELDS.find(f => f[0] === k) || [k, k])[1];
    await logEvent(r.id, 'edit', label + (old ? ' changed' : ' filled in') + (k === 'issue' ? '' : ': ' + (value || '(cleared)')));
    await loadEvents(r.id); renderRecord(true);
  }

async function setReceived(d) {
  d = d || (document.getElementById('rec-date') || {}).value;
  if (!d) return toast('Pick the date it was received.', true);
  const r = records.find(x => x.id === openRecordId); if (!r) return;
  const iso = dateToIso(d);
  const st = Object.assign({}, r.step_times || {}); st.Received = iso;
  const sources = Object.assign({}, r.sources || {}); sources.received_at = 'Edited';
  if (await patchRecord({ received_at: iso, step_times: st, sources })) {
    await logEvent(r.id, 'step', 'Received ' + fmtDate(iso) + ' · 14-day clock started');
    await loadEvents(r.id); renderRecord(true);
  }
}
async function moveStep(dir, to) {
  const r = records.find(x => x.id === openRecordId); if (!r) return;
  const si = Math.max(0, STEPS.indexOf(r.step));
  const target = to || STEPS[si + dir];
  if (!target) return;
  if (dir > 0 && !r.received_at) return toast('Mark it received first.', true);
  const st = Object.assign({}, r.step_times || {});
  if (dir > 0 || to) st[target] = new Date().toISOString();
  if (await patchRecord({ step: target, step_times: st })) {
    await logEvent(r.id, 'step', (dir < 0 ? 'Moved back to ' : 'Moved to ') + target);
    await loadEvents(r.id); renderRecord(true);
    toast('Now at ' + target);
  }
}

let openSecs = new Set(), recTab = 'Assessment', photos = [], photoUrls = {}, saveTimer = null, saving = false;

function asOf(r) { return r.assessment && typeof r.assessment === 'object' ? r.assessment : {}; }
function secData(r, id) { const a = asOf(r); if (!a[id]) a[id] = { v: {} }; if (!a[id].v) a[id].v = {}; r.assessment = a; return a[id]; }
function rowMissing(d, row) {
  const [key, , , kind, extra] = row, v = d.v[key];
  if (kind === 'multi') return !(Array.isArray(v) && v.length);
  if (!v) return true;
  if (extra && v === 'Reading' && !String(d.v[extra] || '').trim()) return true;
  return false;
}
function secStatus(r, s) {
  const d = (asOf(r)[s.id]) || { v: {} };
  d.v = d.v || {};
  const missing = s.rows.filter(row => rowMissing(d, row)).length + (s.id === 'C' && d.v.leak === 'Leak detected' && !String(d.v.leak1 || '').trim() ? 1 : 0);
  const touched = Object.keys(d.v).some(k => { const x = d.v[k]; return Array.isArray(x) ? x.length : String(x || '').trim(); }) || String(d.raw || d.text || '').trim();
  return missing === 0 ? 'done' : touched ? 'partial' : 'empty';
}

function renderTabs(r) {
  const avail = { 'Assessment': true, 'Work performed': true, 'Testing': true, 'QC': true, 'Report': true };
  return `<div class="tabs" style="margin-bottom:0;">${['Assessment', 'Work performed', 'Testing', 'QC', 'Report'].map(t =>
    `<button class="tab ${recTab === t ? 'on' : ''}" ${avail[t] ? `onclick="recTab='${t}';renderRecord(true)"` : 'disabled title="Coming in a later install"'}>${t}</button>`).join('')}</div>`;
}
function renderAssessment(r) {
  const done = CUSTOMER_SECS.filter(id => secStatus(r, SECTIONS.find(s => s.id === id)) === 'done').length;
  if (!openSecs.size) { const first = SECTIONS.find(s => secStatus(r, s) !== 'done'); if (first) openSecs.add(first.id); }
  let h = `<div class="bar" style="justify-content:space-between;">
      <span><b>${done} of ${CUSTOMER_SECS.length}</b> customer sections done${r.assessed_at ? ` · finished by ${esc(nameOf(r.assessed_by))} on ${fmtDate(r.assessed_at)}` : ''}</span>
      <span class="note" id="as-status">Saves automatically</span></div>
    <p class="note">Fill this in as received, before any adjustment, cleaning or repair. Sections A–G go on the customer’s Service Report; H stays internal.</p>`;
  h += SECTIONS.map(s => `<div class="sec ${openSecs.has(s.id) ? 'open' : ''}" id="sec-${s.id}">${secInner(r, s)}</div>`).join('');
  const ready = done === CUSTOMER_SECS.length;
  h += `<div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <b>Finish the assessment</b>
      <span class="note">${ready ? 'All customer sections are done.' : 'Sections A–G must be complete first. Missing answers are marked in yellow.'}</span>
      <div class="bar"><button class="btn primary" ${ready ? '' : 'disabled'} onclick="finishAssessment('Quote')">Finish → Quote</button>
      <button class="btn" ${ready ? '' : 'disabled'} onclick="finishAssessment('Repair')">Finish → Repair (warranty, no quote)</button></div></div>`;
  return h;
}
function secInner(r, s) {
  const d = secData(r, s.id), st = secStatus(r, s);
  const badge = st === 'done' ? '<span class="pill step">Done</span>' : st === 'partial' ? '<span class="pill hold">In progress</span>' : '<span class="pill">Not started</span>';
  let h = `<button class="sec-h" onclick="toggleSec('${s.id}')" aria-expanded="${openSecs.has(s.id)}"><span><b>${s.id} · ${esc(s.title)}</b>${s.internal ? ' <span class="pill">Internal only</span>' : ''}</span>${badge}</button>`;
  if (!openSecs.has(s.id)) return h;
  h += '<div class="sec-b">';
  s.rows.forEach(row => {
    const [key, label, opts, kind, extra] = row, val = d.v[key], miss = rowMissing(d, row);
    h += `<div class="arow ${miss ? 'miss' : ''}"><span class="alab">${esc(label)}</span><div class="opts">` +
      opts.map(o => { const on = kind === 'multi' ? (Array.isArray(val) && val.includes(o)) : val === o;
        return `<button type="button" class="opt ${on ? 'on' : ''}" aria-pressed="${on}" onclick="${kind === 'multi' ? 'toggleMulti' : 'setOpt'}('${s.id}','${key}',${JSON.stringify(o).replace(/"/g, '&quot;')})">${esc(o)}</button>`; }).join('') +
      (extra && val === 'Reading' ? `<input class="mini" type="number" inputmode="decimal" placeholder="bar" value="${esc(d.v[extra] || '')}" oninput="setVal('${s.id}','${extra}',this.value)" aria-label="${esc(label)} reading in bar"><span class="note">bar</span>` : '') +
      '</div></div>';
  });
  if (s.id === 'C' && d.v.leak === 'Leak detected') {
    h += `<div class="grid3">${[1, 2, 3].map(n => `<label class="l">Leak ${n} location${n === 1 ? '' : ' (optional)'}<input value="${esc(d.v['leak' + n] || '')}" oninput="setVal('C','leak${n}',this.value)" class="${n === 1 && !String(d.v.leak1 || '').trim() ? 'need' : ''}"></label>`).join('')}</div>`;
  }
  if (s.id === 'D' && d.v.noise === 'Abnormality observed') h += `<label class="l" style="margin-top:8px;">If abnormal: when, where, what kind of resistance or noise<textarea oninput="setVal('D','abnormal',this.value)">${esc(d.v.abnormal || '')}</textarea></label>`;
  if (s.id === 'F') h += `<label class="l" style="margin-top:8px;">Measurements / test details (if performed)<textarea oninput="setVal('F','measurements',this.value)">${esc(d.v.measurements || '')}</textarea></label>`;
  if (s.id === 'H') {
    const parts = Array.isArray(d.v.parts) ? d.v.parts : [];
    h += `<label class="l" style="margin-top:8px;">Proposed work / repair actions<textarea oninput="setVal('H','work',this.value)">${esc(d.v.work || '')}</textarea></label>
      <label class="l">Further diagnosis or inspection required<textarea oninput="setVal('H','diag',this.value)">${esc(d.v.diag || '')}</textarea></label>
      <label class="l" style="max-width:220px;">Estimated technician time (hours)<input type="number" step="0.25" value="${esc(d.v.hours || '')}" oninput="setVal('H','hours',this.value)"></label>
      <div class="l">Expected parts (preliminary)</div>
      <div id="h-parts">${parts.map((p, i) => partRow(p, i)).join('')}</div>
      <div><button class="btn sm" onclick="addPart()">Add part</button></div>
      <label class="l">Additional findings / uncertainties<textarea oninput="setVal('H','extra',this.value)">${esc(d.v.extra || '')}</textarea></label>`;
  } else {
    h += `<div class="find">
      <label class="l">Your notes<textarea id="raw-${s.id}" placeholder="Quick notes are fine" oninput="setNotes('${s.id}','raw',this.value)">${esc(d.raw || '')}</textarea></label>
      <div class="bar"><button class="btn sm teal" id="rw-${s.id}" onclick="rewrite('${s.id}')">Rewrite for customer</button><span class="note" id="rwmsg-${s.id}"></span></div>
      <label class="l"><span>Customer will see <span style="color:var(--warn);">(goes on the Service Report)</span></span><textarea id="txt-${s.id}" placeholder="Click “Rewrite for customer”, or write it here" oninput="setNotes('${s.id}','text',this.value)">${esc(d.text || '')}</textarea></label>
    </div>
    <div class="phwrap"><div class="l">Photos</div><div class="phs" id="ph-${s.id}">${photosHtml(s.id)}</div>
      <div class="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropFiles(event,'${s.id}')">
        Drag photos here, or <label class="btn sm">Choose files<input type="file" accept="image/*" multiple hidden onchange="addFiles('${s.id}',this.files);this.value=''"></label>
        <button class="btn sm" onclick="phoneQr('${s.id}')">Add from phone</button></div></div>`;
  }
  return h + '</div>';
}
function partRow(p, i) {
  return `<div class="prow"><input type="number" min="1" value="${esc(p.qty || 1)}" oninput="setPart(${i},'qty',this.value)" aria-label="Quantity" style="max-width:80px;">
    <input value="${esc(p.desc || '')}" placeholder="Part / component" oninput="setPart(${i},'desc',this.value)" aria-label="Part description">
    <input value="${esc(p.pn || '')}" placeholder="Part # (if known)" oninput="setPart(${i},'pn',this.value)" aria-label="Part number" style="max-width:180px;">
    <button class="btn sm ghost" onclick="removePart(${i})" aria-label="Remove part">Remove</button></div>`;
}
function curRec() { return records.find(x => x.id === openRecordId); }
function rerenderSec(id) { const r = curRec(), s = SECTIONS.find(x => x.id === id), el = document.getElementById('sec-' + id); if (r && s && el) { el.className = 'sec ' + (openSecs.has(id) ? 'open' : ''); el.innerHTML = secInner(r, s); } }
function toggleSec(id) { openSecs.has(id) ? openSecs.delete(id) : openSecs.add(id); rerenderSec(id); }
function setOpt(id, key, val) { const r = curRec(); const d = secData(r, id); d.v[key] = d.v[key] === val ? null : val; scheduleSave(); rerenderSec(id); refreshProgress(); }
function toggleMulti(id, key, val) { const r = curRec(); const d = secData(r, id); const a = Array.isArray(d.v[key]) ? d.v[key] : []; d.v[key] = a.includes(val) ? a.filter(x => x !== val) : a.concat(val); scheduleSave(); rerenderSec(id); refreshProgress(); }
function setVal(id, key, val) { const r = curRec(); secData(r, id).v[key] = val; scheduleSave(); }
function setNotes(id, which, val) { notesObj(id)[which] = val; scheduleSave(); const b = document.getElementById('w-done'); if (b && id === 'W') b.disabled = !String(workOf(curRec()).text || workOf(curRec()).raw || '').trim(); }
function addPart() { const r = curRec(); const d = secData(r, 'H'); d.v.parts = (Array.isArray(d.v.parts) ? d.v.parts : []).concat({ qty: 1, desc: '', pn: '' }); scheduleSave(); rerenderSec('H'); }
function setPart(i, k, v) { const r = curRec(); const d = secData(r, 'H'); if (d.v.parts && d.v.parts[i]) { d.v.parts[i][k] = v; scheduleSave(); } }
function removePart(i) { const r = curRec(); const d = secData(r, 'H'); (d.v.parts || []).splice(i, 1); scheduleSave(); rerenderSec('H'); }
function refreshProgress() { if (recTab !== 'Assessment') return; const r = curRec(); const el = document.querySelector('#tabbody > .bar span'); if (!r || !el) return;
  const done = CUSTOMER_SECS.filter(id => secStatus(r, SECTIONS.find(s => s.id === id)) === 'done').length;
  el.innerHTML = `<b>${done} of ${CUSTOMER_SECS.length}</b> customer sections done`;
  const ready = done === CUSTOMER_SECS.length;
  document.querySelectorAll('#tabbody .card .btn').forEach(b => { b.disabled = !ready; });
}
function scheduleSave() {
  const st = document.getElementById('as-status'); if (st) st.textContent = 'Saving…';
  clearTimeout(saveTimer); saveTimer = setTimeout(saveAssessment, 700);
}
async function saveAssessment() {
  saveTimer = null; const r = curRec(); if (!r) return;
  saving = true;
  const { error } = await sb.from('rr_records').update({ assessment: r.assessment || {}, work: r.work || {}, tests: r.tests || {} }).eq('id', r.id);
  saving = false;
  const st = document.getElementById('as-status');
  if (error) { if (st) st.textContent = 'Not saved'; toast('Could not save: ' + error.message, true); }
  else if (st) st.textContent = 'Saved';
}
async function finishAssessment(next) {
  const r = curRec(); if (!r) return;
  if (saveTimer) { clearTimeout(saveTimer); await saveAssessment(); }
  const patch = { assessed_by: me, assessed_at: new Date().toISOString() };
  const si = Math.max(0, STEPS.indexOf(r.step));
  if (si < STEPS.indexOf(next)) { const st = Object.assign({}, r.step_times || {}); st.Assessment = st.Assessment || patch.assessed_at; st[next] = patch.assessed_at; patch.step = next; patch.step_times = st; }
  if (await patchRecord(patch)) {
    await logEvent(r.id, 'step', 'Assessment finished' + (patch.step ? ', moved to ' + next : ''));
    await loadEvents(r.id); renderRecord(true); toast('Assessment finished');
  }
}
async function rewrite(id) {
  const r = curRec(); const d = notesObj(id);
  const notes = String(d.raw || '').trim();
  const msg = document.getElementById('rwmsg-' + id), btn = document.getElementById('rw-' + id);
  if (!notes) { msg.textContent = 'Type your notes first.'; return; }
  if (String(d.text || '').trim() && !confirm('Replace what the customer will see with new wording?')) return;
  btn.disabled = true; msg.textContent = 'Rewriting…';
  try {
    const { data: s } = await sb.auth.getSession();
    const res = await fetch(SERVER + '/rewrite-for-customer', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s && s.session ? s.session.access_token : '') },
      body: JSON.stringify({ text: notes, section: id === 'W' ? 'Work performed' : id + ' ' + (SECTIONS.find(x => x.id === id) || {}).title }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'failed (' + res.status + ')');
    d.text = out.text; const ta = document.getElementById('txt-' + id); if (ta) ta.value = out.text;
    msg.textContent = 'Done. Check it and edit if needed.'; scheduleSave();
  } catch (e) { msg.textContent = 'Could not rewrite (' + e.message + '). Write it by hand.'; }
  finally { btn.disabled = false; }
}

// ── PHOTOS ──
async function loadPhotos(id) {
  const { data } = await sb.from('rr_photos').select('*').eq('record_id', id).order('created_at', { ascending: true });
  photos = data || [];
  const need = photos.map(p => p.path).filter(p => !photoUrls[p]);
  if (need.length) { const { data: s } = await sb.storage.from('rr-photos').createSignedUrls(need, 3600); (s || []).forEach(x => { if (x.signedUrl) photoUrls[x.path] = x.signedUrl; }); }
}
function photosHtml(sec) {
  const list = photos.filter(p => p.section === sec);
  if (!list.length) return '<span class="note">No photos yet.</span>';
  return list.map(p => `<div class="ph"><a href="${esc(photoUrls[p.path] || '#')}" target="_blank" rel="noopener"><img src="${esc(photoUrls[p.path] || '')}" alt="Photo for section ${esc(sec)}"></a>
    <button class="phx" onclick="deletePhoto('${p.id}')" aria-label="Delete photo">×</button></div>`).join('');
}
function refreshPhotoAreas() { SECTIONS.map(s => s.id).concat(EXTRA_PHOTO_SECS.map(x => x[0])).forEach(id => { const el = document.getElementById('ph-' + id); if (el) el.innerHTML = photosHtml(id); });
  if (view === 'record' && recTab === 'Testing' && !typing()) renderRecord(true); const pl = document.getElementById('phone-list'); if (pl) pl.innerHTML = photosHtml(phoneSec()); }
function resizeImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85); URL.revokeObjectURL(img.src); };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}
async function addFiles(sec, fileList, recordId) {
  const files = [...(fileList || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  const rid = recordId || openRecordId; if (!files.length || !rid) return;
  toast('Uploading ' + files.length + ' photo' + (files.length > 1 ? 's' : '') + '…');
  let okN = 0;
  for (const f of files) {
    try {
      const blob = await resizeImage(f);
      const path = `${rid}/${sec}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
      const up = await sb.storage.from('rr-photos').upload(path, blob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const ins = await sb.from('rr_photos').insert({ record_id: rid, section: sec, path, uploaded_by: me });
      if (ins.error) { await sb.storage.from('rr-photos').remove([path]); throw ins.error; }
      okN++;
    } catch (e) { toast('A photo did not upload: ' + (e.message || e), true); }
  }
  if (okN) { await logEvent(rid, 'photo', 'Added ' + okN + ' photo' + (okN > 1 ? 's' : '') + ' to section ' + sec); await loadPhotos(rid); refreshPhotoAreas(); toast(okN + ' photo' + (okN > 1 ? 's' : '') + ' added'); }
}
function dropFiles(e, sec) { e.preventDefault(); e.currentTarget.classList.remove('over'); addFiles(sec, e.dataTransfer.files); }
async function deletePhoto(id) {
  const p = photos.find(x => x.id === id); if (!p || !confirm('Delete this photo?')) return;
  const { error } = await sb.from('rr_photos').delete().eq('id', id);
  if (error) return toast('Could not delete: ' + error.message, true);
  await sb.storage.from('rr-photos').remove([p.path]);
  await logEvent(p.record_id, 'photo', 'Deleted a photo from section ' + p.section);
  await loadPhotos(p.record_id); refreshPhotoAreas();
}
function phoneLink(sec) { return location.origin + location.pathname + '#phone=' + openRecordId + '&s=' + sec; }
function phoneQr(sec) {
  const url = phoneLink(sec);
  document.getElementById('modal-body').innerHTML = `<h2>Add photos from a phone</h2>
    <p class="note">Scan this with the phone’s camera. It opens this repair on the phone, ready to add photos for ${esc((EXTRA_PHOTO_SECS.find(x => x[0] === sec) || [, 'section ' + sec])[1])}. They appear here within a few seconds.</p>
    <div id="qr" style="background:#fff;padding:14px;border-radius:8px;align-self:center;"></div>
    <p class="note" style="word-break:break-all;">${esc(url)}</p>
    <div class="bar"><button class="btn" onclick="closeModal()">Done</button></div>`;
  document.getElementById('modal').classList.add('open');
  try { new QRCode(document.getElementById('qr'), { text: url, width: 220, height: 220 }); }
  catch (e) { document.getElementById('qr').textContent = 'QR code could not be drawn. Open the link above on the phone.'; }
}

// ── PHONE MODE (opened from the QR code) ──

let phoneSecSel = null;
function phoneSec() { return phoneSecSel || (phoneParams() || {}).sec || 'A'; }
async function renderPhone() {

    <label class="l">Section<select id="ph-sec" onchange="phoneSecSel=this.value;document.getElementById('phone-list').innerHTML=photosHtml(this.value)">${SECTIONS.filter(s => !s.internal).map(s => `<option value="${s.id}" ${s.id === phoneSec() ? 'selected' : ''}>${s.id} · ${esc(s.title)}</option>`).join('')}${EXTRA_PHOTO_SECS.map(([id, t]) => `<option value="${id}" ${id === phoneSec() ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
    <label class="btn primary" style="justify-content:center;min-height:56px;font-size:17px;">Take or choose photos<input type="file" accept="image/*" multiple hidden onchange="addFiles(phoneSec(),this.files,'${r.id}');this.value=''"></label>
    <div class="phs" id="phone-list">${photosHtml(phoneSec())}</div>
    <p class="note">Photos go straight onto the repair card on the computer. You can close this page when you’re done.</p></div>`;
}

// ── WORK PERFORMED ──────────────────────────────────────

function notesObj(id) { const r = curRec(); return id === 'W' ? workOf(r) : secData(r, id); }
function notesBlock(id, label) {
  const d = notesObj(id);
  return `<div class="find">
    <label class="l">${label || 'Your notes'}<textarea id="raw-${id}" placeholder="Quick notes are fine" oninput="setNotes('${id}','raw',this.value)">${esc(d.raw || '')}</textarea></label>
    <div class="bar"><button class="btn sm teal" id="rw-${id}" onclick="rewrite('${id}')">Rewrite for customer</button><span class="note" id="rwmsg-${id}"></span></div>
    <label class="l"><span>Customer will see <span style="color:var(--warn);">(goes on the Service Report)</span></span><textarea id="txt-${id}" placeholder="Click “Rewrite for customer”, or write it here" oninput="setNotes('${id}','text',this.value)">${esc(d.text || '')}</textarea></label></div>`;

function photoBlock(sec, label) {

      <button class="btn sm" onclick="phoneQr('${sec}')">Add from phone</button></div></div>`;
}
function renderWork(r) {
  const w = workOf(r);
  const est = ((asOf(r).H || {}).v || {}).parts || [];
  return `<div class="bar" style="justify-content:space-between;"><span>${r.repaired_at ? `Repair marked done by <b>${esc(nameOf(r.repaired_by))}</b> on ${fmtDate(r.repaired_at)}` : 'Describe what was done. It goes on the Service Report.'}</span><span class="note" id="as-status">Saves automatically</span></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;"><h2>What was done</h2>${notesBlock('W', 'Your notes (what you did)')}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;"><div class="bar" style="justify-content:space-between;"><h2>Parts used</h2>${est.length ? `<button class="btn sm" onclick="copyEstimateParts()">Copy from the estimate (H)</button>` : ''}</div>
      <div id="w-parts">${w.parts.map((p, i) => workPartRow(p, i)).join('') || '<span class="note">No parts yet.</span>'}</div>
      <div><button class="btn sm" onclick="addWorkPart()">Add part</button></div></div>

      <span class="note">${String(w.text || w.raw || '').trim() ? 'Ready.' : 'Add a description of the work first.'}</span>
      <div class="bar"><button class="btn primary" ${String(w.text || w.raw || '').trim() ? '' : 'disabled'} id="w-done" onclick="finishWork()">Repair done → Testing</button></div></div>`;

  const st = document.getElementById('as-status'); if (st) st.textContent = error ? 'Not saved' : 'Saved';
  if (error) toast('Could not save: ' + error.message, true);
}
async function passQc() {
  const r = curRec(); if (!r) return;
  if (qcTimer) { clearTimeout(qcTimer); await saveQc(); }
  if (!QC_CHECKS.every(([k]) => qcOf(r).checks[k])) return toast('Tick every check first.', true);
  const now = new Date().toISOString();
  const patch = { qc_by: me, qc_at: now, qc: r.qc };
  if (STEPS.indexOf(r.step) < STEPS.indexOf('Ready to ship')) { const st = Object.assign({}, r.step_times || {}); st.QC = st.QC || now; st['Ready to ship'] = now; patch.step = 'Ready to ship'; patch.step_times = st; }
  if (await patchRecord(patch)) { await logEvent(r.id, 'step', 'QC passed' + (patch.step ? ', moved to Ready to ship' : '')); await loadEvents(r.id); recTab = 'Report'; renderRecord(true); toast('QC passed. The Service Report is ready.'); }
}
function failQc() {
  document.getElementById('modal-body').innerHTML = `<h2>QC failed</h2>
    <p class="note">The record goes back to Repair. Say what needs fixing; it’s saved in the history.</p>
    <label class="l">What failed<textarea id="qcf-why"></textarea></label>
    <div class="bar"><button class="btn primary" onclick="saveFailQc()">Send back to Repair</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('qcf-why').focus(), 30);
}
async function saveFailQc() {
  const why = document.getElementById('qcf-why').value.trim();
  if (!why) return toast('Say what failed.', true);
  closeModal();
  const r = curRec(); if (!r) return;
  const q = qcOf(r); q.checks = {}; q.notes = (q.notes ? q.notes + '\n' : '') + 'QC failed ' + fmtDate(new Date().toISOString()) + ': ' + why;
  const patch = { step: 'Repair', qc: q, qc_by: null, qc_at: null, repaired_at: null, repaired_by: null, tested_at: null, tested_by: null };
  if (await patchRecord(patch)) { await logEvent(r.id, 'qc', 'QC failed, back to Repair: ' + why); await loadEvents(r.id); recTab = 'Work performed'; renderRecord(true); toast('Sent back to Repair'); }
}

// ── SERVICE REPORT ──────────────────────────────────────
let sendMsg = null;           // message being edited for the Freshdesk reply
function reportReady(r) {
  const miss = [];
  if (!r.assessed_at) miss.push('assessment');
  if (!r.repaired_at) miss.push('work performed');
  if (!r.tested_at) miss.push('testing');
  if (!r.qc_at) miss.push('QC');
  return miss;
}
function rowText(d, row) {
  const [key, , , kind, extra] = row, v = d.v[key];
  if (kind === 'multi') return Array.isArray(v) && v.length ? v.join(', ') : '—';
  if (!v) return '—';
  if (extra && v === 'Reading') return (d.v[extra] ? d.v[extra] + ' bar' : 'Reading');
  return v;
}
function goodWord(v) { return /^(Good|Intact|Secure|Pass|No leak detected|None observed|Complete|No issues observed|Factory original)$/i.test(v); }
function badWord(v) { return /(Damage|Fail|Leak detected|Missing|Loose|Abnormal|Issue|Safety hold|Contamination|Modified)/i.test(v); }
function repPics(sec) {
  const list = photos.filter(p => p.section === sec && photoUrls[p.path]).slice(0, 4);
  return list.length ? `<div class="pics">${list.map(p => `<img src="${esc(photoUrls[p.path])}" crossorigin="anonymous" alt="">`).join('')}</div>` : '';
}
function reportHtml(r) {
  const a = asOf(r), w = workOf(r), t = testsOf(r);
  const today = new Date().toISOString();
  const warr = r.warranty === 'Yes' ? 'Under warranty' : r.warranty === 'No' ? 'Not under warranty' : '—';
  const kv = (k, v) => `<div><b>${esc(k)}</b><span>${esc(v || '—')}</span></div>`;
  let h = `<div class="rep" id="rep">
    <div class="rhead"><img src="${FX_LOGO}" alt="FX Airguns" style="height:34px;"><div style="text-align:right;"><div class="rtitle">SERVICE REPORT</div>
      <div>${r.freshdesk_ticket ? 'Ticket #' + esc(r.freshdesk_ticket) + ' · ' : ''}${fmtDate(r.qc_at || today)}</div></div></div>
    <h3>Customer &amp; rifle</h3>
    <div class="kv">${kv('Customer', r.customer_name)}${kv('Model', r.model ? (/^fx\b/i.test(r.model) ? r.model : 'FX ' + r.model) : '')}${kv('Email', r.email)}${kv('Serial #', r.serial_number)}${kv('Phone', r.phone)}${kv('Caliber', r.caliber)}${kv('Received', fmtDate(r.received_at))}${kv('Barrel length', r.barrel_length)}${kv('Completed', fmtDate(r.qc_at || today))}${kv('Warranty', warr)}</div>`;
  if (r.issue) h += `<h3>What you told us</h3><div class="say">${esc(r.issue)}</div>`;
  // As-received assessment: every row (customer sections only)
  h += `<h3>Assessment as received</h3><p style="margin:0 0 6px;color:#5a6168;">Recorded when the rifle arrived, before any adjustment, cleaning or repair.</p>`;
  SECTIONS.filter(s => !s.internal).forEach(s => {
    const d = a[s.id] || { v: {} }; d.v = d.v || {};
    let rows = s.rows.map(row => { const val = rowText(d, row); return `<tr><td style="width:46%;">${esc(row[1])}</td><td class="${goodWord(val) ? 'ok' : badWord(val) ? 'bad' : ''}">${esc(val)}</td></tr>`; }).join('');
    if (s.id === 'C' && d.v.leak === 'Leak detected') [1, 2, 3].forEach(n => { if (String(d.v['leak' + n] || '').trim()) rows += `<tr><td>Leak ${n} location</td><td>${esc(d.v['leak' + n])}</td></tr>`; });
    if (s.id === 'D' && d.v.abnormal) rows += `<tr><td>Details</td><td>${esc(d.v.abnormal)}</td></tr>`;
    if (s.id === 'F' && d.v.measurements) rows += `<tr><td>Measurements</td><td>${esc(d.v.measurements)}</td></tr>`;
    h += `<div class="rep-avoid"><h4>${s.id} · ${esc(s.title)}</h4><table>${rows}</table>${String(d.text || '').trim() ? `<div class="say">${esc(d.text)}</div>` : ''}${repPics(s.id)}</div>`;
  });
  // Work performed
  h += `<div class="rep-avoid"><h3>Work performed</h3><div class="say">${esc(String(w.text || '').trim() || String(w.raw || '').trim() || '—')}</div>`;
  const parts = (w.parts || []).filter(p => String(p.desc || p.pn || '').trim());
  if (parts.length) h += `<table><tr><th style="width:60px;">Qty</th><th>Part</th><th style="width:150px;">Part #</th></tr>${parts.map(p => `<tr><td>${esc(p.qty || 1)}</td><td>${esc(p.desc)}</td><td>${esc(p.pn)}</td></tr>`).join('')}</table>`;
  h += `${repPics('W')}</div>`;
  // Test results
  const strs = t.strings.map(s => ({ s, st: stats(s.shots || [], s.grains) })).filter(x => x.st);
  h += `<div class="rep-avoid"><h3>Test results</h3>`;
  if (strs.length) h += `<table><tr><th>String</th><th>Pellet</th><th>Weight</th><th>Regulator</th><th>Shots</th><th>Average</th><th>ES</th><th>SD</th><th>Energy</th><th>Result</th></tr>` +
    strs.map(({ s, st }, i) => `<tr><td>${i + 1}</td><td>${esc(s.pellet || '—')}</td><td>${s.grains ? esc(s.grains) + ' gr' : '—'}</td><td>${s.reg_bar ? esc(s.reg_bar) + ' bar' : '—'}</td><td>${st.n}</td><td>${st.avg.toFixed(1)} fps</td><td>${st.es.toFixed(1).replace(/\.0$/, '')}</td><td>${st.sd.toFixed(1)}</td><td>${st.fpe == null ? '—' : st.fpe.toFixed(1) + ' ft·lb'}</td><td class="${s.result === 'Pass' ? 'ok' : s.result === 'Fail' ? 'bad' : ''}">${esc(s.result || '—')}</td></tr>`).join('') + '</table>';
  else h += '<p>No velocity test recorded.</p>';
  const acc = t.accuracy || {};
  if (String(acc.group_in || '').trim()) {
    const how = [acc.shots ? esc(acc.shots) + ' shots' : '', acc.distance_yd ? 'at ' + esc(acc.distance_yd) + ' yd' : ''].filter(Boolean).join(' ');
    h += `<p style="margin-top:6px;"><b>Accuracy:</b> ${how ? how + ', ' : ''}group ${esc(acc.group_in)} in (center to center)${acc.result ? ` · <span class="${acc.result === 'Pass' ? 'ok' : 'bad'}">${esc(acc.result)}</span>` : ''}</p>`;
  }
  h += `${repPics('Target')}</div>`;
  // Sign-off
  h += `<div class="rep-avoid"><h3>Sign-off</h3><div class="sig">
    <div><b>Assessed by</b><br>${esc(fullName(r.assessed_by) || '—')}<br>${fmtDate(r.assessed_at)}</div>
    <div><b>Repaired by</b><br>${esc(fullName(r.repaired_by) || '—')}<br>${fmtDate(r.repaired_at)}</div>
    <div><b>Tested by</b><br>${esc(fullName(r.tested_by) || '—')}<br>${fmtDate(r.tested_at)}</div>
    <div><b>QC by</b><br>${esc(fullName(r.qc_by) || '—')}<br>${fmtDate(r.qc_at)}</div></div>
    <div class="foot">FX Airguns · Questions about this report? Reply to your support ticket${r.freshdesk_ticket ? ' #' + esc(r.freshdesk_ticket) : ''} and our team will help.</div></div>`;
  return h + '</div>';
}
function defaultMessage(r) {
  const first = String(r.customer_name || '').trim().split(/\s+/)[0] || 'there';
  const model = r.model ? (/^fx\b/i.test(r.model) ? r.model : 'FX ' + r.model) : 'rifle';
  return `Hi ${first},\n\nThe repair on your ${model}${r.serial_number ? ' (serial ' + r.serial_number + ')' : ''} is complete and it has passed our final quality check.\n\nYour Service Report is attached. It shows what we found when the rifle arrived, the work we did, and the test results.\n\nWe'll send you the tracking number as soon as it ships.\n\nThank you for your patience,\nFX Airguns Service Team`;
}
function renderReport(r) {
  const miss = reportReady(r);
  if (sendMsg == null) sendMsg = defaultMessage(r);
  let h = '';
  if (r.report_sent_at) h += `<div class="sentbox">Sent to Freshdesk ticket #${esc(r.freshdesk_ticket)} by ${esc(fullName(r.report_sent_by))} on ${fmtDT(r.report_sent_at)}${r.report_file ? ' · ' + esc(r.report_file) : ''}</div>`;
  if (miss.length) h += `<div class="holdbox"><b>Not finished yet: ${esc(miss.join(', '))}</b><span class="note" style="color:var(--warn);">You can preview the report now. It can be sent once every step is done.</span></div>`;
  h += `<div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <div class="bar" style="justify-content:space-between;"><h2>Send to the customer</h2><button class="btn sm" onclick="downloadReport()">Download PDF</button></div>
      <label class="l">Message (goes in the Freshdesk reply, with the PDF attached)<textarea id="send-msg" rows="9" oninput="sendMsg=this.value">${esc(sendMsg)}</textarea></label>
      <div class="bar"><button class="btn primary" id="send-btn" ${miss.length || !r.freshdesk_ticket ? 'disabled' : ''} onclick="sendReport()">${r.report_sent_at ? 'Send again' : 'Send'} to Freshdesk ticket #${esc(r.freshdesk_ticket || '?')}</button>
      <button class="btn sm ghost" onclick="sendMsg=null;renderRecord(true)">Reset message</button><span class="note" id="send-note">${!r.freshdesk_ticket ? 'Add the Freshdesk # on page 1 first.' : 'Testing: only works on a ticket listed as a test ticket on the server.'}</span></div></div>
    <div class="card"><h2 style="margin-bottom:10px;">Preview</h2><div class="repwrap">${reportHtml(r)}</div></div>`;
  return h;
}
function reportFileName(r) {
  const clean = x => String(x || '').replace(/[\\/:*?"<>|#%]/g, '').replace(/\s+/g, ' ').trim();
  return clean(`Service Report - ${r.freshdesk_ticket ? '#' + r.freshdesk_ticket + ' - ' : ''}${r.customer_name || 'Customer'}`) + '.pdf';
}
async function makePdf(r, mode) {
  if (!window.html2pdf) throw new Error('The PDF tool did not load. Refresh the page and try again.');
  await loadPhotos(r.id);                     // fresh photo links
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-10000px;top:0;';
  box.innerHTML = reportHtml(r);
  document.body.appendChild(box);
  try {
    const worker = html2pdf().set({
      margin: [8, 8, 10, 8], filename: reportFileName(r),
      image: { type: 'jpeg', quality: 0.86 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['.rep-avoid', 'tr'] }
    }).from(box.firstElementChild);
    if (mode === 'save') { await worker.save(); return null; }
    return await worker.outputPdf('datauristring');
  } finally { box.remove(); }
}
async function downloadReport() {
  const r = curRec(); if (!r) return;
  toast('Making the PDF…');
  try { await makePdf(r, 'save'); } catch (e) { toast('Could not make the PDF: ' + e.message, true); }
}
async function sendReport() {
  const r = curRec(); if (!r) return;
  const miss = reportReady(r); if (miss.length) return toast('Not finished yet: ' + miss.join(', '), true);
  const msg = String(sendMsg || '').trim(); if (!msg) return toast('Write a message first.', true);
  if (!confirm(`Send the Service Report to Freshdesk ticket #${r.freshdesk_ticket}?\n\nThe customer on that ticket gets this reply with the PDF attached.`)) return;
  const btn = document.getElementById('send-btn'), note = document.getElementById('send-note');
  btn.disabled = true; note.textContent = 'Making the PDF…';
  try {
    const uri = await makePdf(r, 'data');
    note.textContent = 'Sending to Freshdesk…';
    const { data: s } = await sb.auth.getSession();
    const res = await fetch(SERVER + '/repair-record/send-report', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s && s.session ? s.session.access_token : '') },
      body: JSON.stringify({ record_id: r.id, message: msg, filename: reportFileName(r), pdf_base64: String(uri).split(',')[1] }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'failed (' + res.status + ')');
    const { data } = await sb.from('rr_records').select('*').eq('id', r.id).single();
    if (data) Object.assign(r, data);
    await loadEvents(r.id); sendMsg = null; renderRecord(true); toast('Sent to Freshdesk #' + r.freshdesk_ticket);
  } catch (e) {
    note.textContent = 'Not sent: ' + e.message; btn.disabled = false; toast('Not sent: ' + e.message, true);
  }
}

// ── TEST STANDARDS PAGE ─────────────────────────────────
const STD_COLS = [['model', 'Model', 'e.g. DRS MkII'], ['caliber', 'Caliber', '.30'], ['pellet', 'Pellet (blank = any)', ''], ['grains', 'Grains', ''], ['fps_min', 'Min fps', ''], ['fps_max', 'Max fps', ''],
  ['es_max', 'Max ES', ''], ['sd_max', 'Max SD', ''], ['acc_distance_yd', 'Accuracy yd', ''], ['acc_group_in', 'Max group (in)', ''], ['notes', 'Notes', '']];
const STD_NUM = ['grains', 'fps_min', 'fps_max', 'es_max', 'sd_max', 'acc_distance_yd', 'acc_group_in'];
async function openStandards() { view = 'standards'; openRecordId = null; await loadStandards(); renderStandards(); }
function renderStandards() {
  const v = document.getElementById('view');
  v.innerHTML = `<a href="#" onclick="backToList();return false;" style="color:var(--teal);font-size:13px;text-decoration:none;">← Repairs</a>
    <h1>Test standards</h1><p class="lede">One row per model and caliber (and pellet if it matters). Pass/fail on the Testing tab uses these. Changes save as you type.</p>
    <div style="overflow-x:auto;"><table class="stdt"><thead><tr>${STD_COLS.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>
    ${standards.map(s => `<tr>${STD_COLS.map(([k, , ph]) => `<td><input value="${esc(s[k] ?? '')}" placeholder="${esc(ph)}" ${STD_NUM.includes(k) ? 'inputmode="decimal"' : ''} onchange="saveStd('${s.id}','${k}',this.value)" aria-label="${k}"></td>`).join('')}<td><button class="btn sm ghost" onclick="deleteStd('${s.id}')">Delete</button></td></tr>`).join('')
      || `<tr><td colspan="${STD_COLS.length + 1}" class="muted" style="padding:20px;">No standards yet.</td></tr>`}
    </tbody></table></div><div style="margin-top:12px;"><button class="btn primary" onclick="addStd()">Add a standard</button></div>`;
}
async function addStd() { const { error } = await sb.from('rr_standards').insert({ model: 'New model', caliber: '', updated_by: me }); if (error) return toast('Could not add: ' + error.message, true); await loadStandards(); renderStandards(); }
async function saveStd(id, k, val) {
  val = String(val).trim(); let v2 = val === '' ? null : val;
  if (STD_NUM.includes(k) && v2 != null) { v2 = Number(v2); if (!isFinite(v2)) return toast('Please enter a number.', true); }
  if ((k === 'model' || k === 'caliber') && v2 == null) v2 = '';
  const { error } = await sb.from('rr_standards').update({ [k]: v2, updated_by: me, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) toast('Could not save: ' + error.message, true); else { const s = standards.find(x => x.id === id); if (s) s[k] = v2; toast('Saved'); }
}
async function deleteStd(id) { if (!confirm('Delete this standard?')) return; await sb.from('rr_standards').delete().eq('id', id); await loadStandards(); renderStandards(); }

// ── LIVE UPDATES ────────────────────────────────────────
let liveT = null;
function typing() { const a = document.activeElement; return a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && a.id !== 'q'; }
function subscribeLive() {
  sb.channel('rr-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_records' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_events' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'repair_tickets' }, onLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_standards' }, async () => { await loadStandards(); if (view === 'standards' && !typing()) renderStandards(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_photos' }, async p => {
      const rid = (p.new && p.new.record_id) || (p.old && p.old.record_id);
      if (openRecordId && (!rid || rid === openRecordId)) { await loadPhotos(openRecordId); refreshPhotoAreas(); }
    })
    .subscribe();
}
function onLive() { clearTimeout(liveT); liveT = setTimeout(liveApply, 800); }
async function liveApply() {
  if (view === 'phone' || view === 'standards') return;
  if (typing() || saveTimer || qcTimer || saving || document.getElementById('modal').classList.contains('open')) { liveT = setTimeout(liveApply, 1500); return; }
  try { await loadAll(); if (openRecordId) await loadEvents(openRecordId); } catch (e) { return; }
  if (view === 'record') renderRecord(true); else renderRows();
}

// ── AUTH ────────────────────────────────────────────────
let launched = false;
async function launch() {
  if (launched) return; launched = true;
  try { await loadAll(); } catch (e) { document.getElementById('view').innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '. Has 12-repair-record.sql been run?</div>'; return; }
  subscribeLive();
  if (phoneParams()) renderPhone(); else renderList();
}
function onSession(s) {
  if (s) { document.getElementById('auth').classList.add('hidden'); me = (s.user.email || '').toLowerCase(); document.getElementById('user-email').textContent = me; setTimeout(launch, 0); }
  else document.getElementById('auth').classList.remove('hidden');
}
sb.auth.onAuthStateChange((_e, s) => onSession(s));
sb.auth.getSession().then(({ data }) => onSession(data.session));
async function signIn() {
  const email = document.getElementById('auth-email').value.trim(), password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-err'); err.textContent = '';
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) err.textContent = 'Login failed. Check your email and password.';
}
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
async function signOut() { await sb.auth.signOut(); location.reload(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
