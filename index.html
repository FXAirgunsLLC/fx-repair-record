<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX Airguns</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top nav */
    #top-nav {
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      height: 52px;
      flex-shrink: 0;
      gap: 0;
    }

    #top-nav .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 2rem;
      flex-shrink: 0;
    }

    #top-nav .logo img {
      height: 28px;
      width: auto;

    }

    #top-nav .logo-text {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
    }

    /* Tabs that don't fit are hidden here and listed in "More ▾" */
    .nav-tab.nav-overflow { display: none; }
    .nav-more-btn { padding: 6px clamp(9px, 0.8vw, 14px); border-radius: 6px; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border: none; background: none; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; }
    .nav-more-btn:hover { background: #222; color: #ccc; }
    .nav-more-btn.active { background: #C9A84C; color: #111; }
    #nav-more-menu { position: fixed; display: none; z-index: 900; min-width: 190px; background: #1d1d1d; border: 1px solid #333; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 4px; }
    #nav-more-menu.open { display: block; }
    .nav-more-item { display: block; width: 100%; text-align: left; background: none; border: none; color: #ccc; font-size: 13px; padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .nav-more-item:hover { background: #2a2a2a; color: #fff; }
    .nav-more-item.active { color: #C9A84C; }

    /* Drop the least important extras as the window narrows */
    @media (max-width: 1500px) { #user-email { display: none; } }
    @media (max-width: 1250px) { .nav-clock { display: none; } }

    .nav-tab {
      padding: 6px clamp(9px, 0.8vw, 14px);
      border-radius: 6px;
      font-size: clamp(12px, 0.75vw, 13px);
      font-weight: 500;
      color: #888;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .nav-tab:hover { background: #222; color: #ccc; }
    .nav-tab.active { background: #C9A84C; color: #111; }

    .nav-clock {
      font-size: 12px;
      color: #666;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Left sidebar */
    #shell-body { flex: 1; display: flex; min-height: 0; }
    #side-nav { width: 196px; flex-shrink: 0; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; overflow-y: auto; overflow-x: hidden; transition: width 0.15s; }
    #side-nav .side-tabs { display: flex; flex-direction: column; gap: 2px; }
    #side-nav .nav-tab { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; font-size: 13px; }
    .nt-ic { width: 20px; flex-shrink: 0; text-align: center; font-size: 15px; line-height: 1; }
    .nt-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nt-badge { background: #C9A84C; color: #111; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 1px 7px; min-width: 20px; text-align: center; flex-shrink: 0; }
    .nav-tab.active .nt-badge { background: #111; color: #C9A84C; }
    #side-collapse { margin-top: auto; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: none; color: #666; font-size: 12px; border-radius: 6px; cursor: pointer; text-align: left; }
    #side-collapse:hover { background: #222; color: #ccc; }
    #side-nav.collapsed { width: 56px; }
    #side-nav.collapsed .nt-label { display: none; }
    #side-nav.collapsed .nav-tab, #side-nav.collapsed #side-collapse { justify-content: center; padding: 9px 0; }
    #side-nav.collapsed .nt-badge { position: absolute; top: 1px; right: 1px; font-size: 10px; padding: 0 5px; min-width: 16px; }

    /* Frame container */
    #frame-container {
      flex: 1;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .app-frame {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .app-frame.active { display: block; }

    /* Master Search */
    #search-wrap { position: relative; margin-left: 1rem; margin-right: 1rem; flex-shrink: 0; }
    #search-input {
      width: clamp(130px, 15vw, 260px);
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
    }
    #search-input:focus { border-color: #C9A84C; }
    #search-results {
      display: none;
      position: absolute;
      top: 36px;
      left: 0;
      width: 420px;
      max-height: 480px;
      overflow-y: auto;
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      z-index: 500;
    }
    #search-results.open { display: block; }
    .sr-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #888; padding: 8px 12px 4px; }
    .sr-item { padding: 8px 12px; cursor: pointer; border-top: 1px solid #2a2a2a; }
    .sr-item:hover { background: #2a2a2a; }
    .sr-item .sr-main { font-size: 13px; color: #eee; font-weight: 600; }
    .sr-item .sr-sub { font-size: 11px; color: #999; margin-top: 2px; }
    .sr-empty, .sr-loading { padding: 14px 12px; font-size: 12px; color: #888; }
    .sr-tier2-label { font-size: 10px; color: #666; padding: 6px 12px 2px; font-style: italic; }

    /* Auth */
    #auth-overlay { position: fixed; inset: 0; background: #1a1a1a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    #auth-overlay.hidden { display: none; }
    .auth-box { background: #222; border: 1px solid #333; border-radius: 10px; padding: 32px 30px; width: 320px; }
    .auth-box img { height: 32px; display: block; margin: 0 auto 20px; }
    .auth-box h2 { font-size: 15px; font-weight: 600; color: #eee; text-align: center; margin-bottom: 20px; }
    .auth-box input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; padding: 10px 12px; margin-bottom: 10px; outline: none; }
    .auth-box input:focus { border-color: #C9A84C; }
    .auth-box button { width: 100%; background: #C9A84C; color: #111; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; padding: 10px; cursor: pointer; margin-top: 6px; }
    .auth-box button:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-err { color: #e06060; font-size: 12px; margin-top: 8px; text-align: center; min-height: 14px; }
    #user-menu { display: flex; align-items: center; gap: 10px; margin-left: 1rem; flex-shrink: 0; font-size: 12px; color: #888; }
    #user-menu button { background: none; border: 1px solid #333; color: #888; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    #user-menu button:hover { color: #ccc; border-color: #555; }

    /* Part photo lookup */
    #pl-btn { padding:6px 12px; border-radius:6px; font-size:13px; font-weight:500; color:#C9A84C; background:none; border:1px solid #5a4a20; cursor:pointer; white-space:nowrap; flex-shrink:0; }
    #pl-btn:hover { background:rgba(201,168,76,0.12); border-color:#C9A84C; }
    #pl-overlay { position:fixed; top:52px; left:0; right:0; bottom:0; background:rgba(0,0,0,.45); z-index:800; display:none; }
    #pl-overlay.open { display:block; }
    #pl-panel { position:absolute; top:0; right:0; bottom:0; width:520px; max-width:100%; background:#1a1a1a; border-left:1px solid #333; display:flex; flex-direction:column; padding:16px; gap:10px; }
    .pl-hdr { display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:600; color:#eee; }
    .pl-hdr button { background:none; border:1px solid #333; color:#888; border-radius:6px; padding:4px 10px; cursor:pointer; }
    #pl-search { width:100%; background:#111; border:1px solid #333; border-radius:6px; color:#fff; font-size:15px; padding:10px 12px; outline:none; }
    #pl-search:focus { border-color:#C9A84C; }
    #pl-status { font-size:12px; color:#888; }
    #pl-results { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; align-content:start; }
    .pl-card { background:#222; border:1px solid #2a2a2a; border-radius:8px; overflow:hidden; cursor:pointer; }
    .pl-card:hover { border-color:#C9A84C; }
    .pl-card img { width:100%; height:120px; object-fit:contain; background:#111; display:block; }
    .pl-card .pl-name { font-size:12px; font-weight:600; color:#eee; padding:6px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #pl-viewer { position:absolute; inset:0; background:#111; flex-direction:column; padding:16px; gap:10px; }
    #pl-viewer img { flex:1; min-height:0; width:100%; object-fit:contain; }
    .pl-vbar { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .pl-vbar .pl-vpart { font-size:16px; font-weight:700; color:#eee; }
    .pl-vbar button { background:none; border:1px solid #333; color:#ccc; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
    .pl-vbar button:hover { border-color:#C9A84C; color:#C9A84C; }
    #deploy-bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:9000; display:flex; align-items:center; gap:12px; max-width:92vw;
    background:#1f2a3a; color:#cfe3ff; border:1px solid #3d6fb0; border-radius:10px; padding:9px 14px; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,.4); }
  #deploy-bar button { background:#3d6fb0; color:#fff; border:none; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <h2 id="auth-title">Sign in to FX Airguns</h2>
    <input type="email" id="auth-email" placeholder="Email" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
    <button id="auth-submit-btn" onclick="handleAuthSubmit()">Sign In</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<div id="cp-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;display:none;align-items:center;justify-content:center;">
  <div class="auth-box">
    <h2>Change Password</h2>
    <input type="password" id="cp-new-password" placeholder="New password" autocomplete="new-password">
    <input type="password" id="cp-confirm-password" placeholder="Confirm new password" autocomplete="new-password">
    <button onclick="submitChangePassword()">Save New Password</button>
    <button onclick="closeChangePassword()" style="background:none;color:#888;border:1px solid #333;margin-top:6px;">Cancel</button>
    <div class="auth-err" id="cp-err"></div>
  </div>
</div>

  // Tab switching
  // Repair Record is locked with a password until go-live (a "keep out for now" lock, not security).
  // Only a SHA-256 of the password is stored here; a computer that unlocked it once stays unlocked.
  const RR_LOCK_HASH = '07579f7244a82defb03cc7dead89308520b96198548daf03fc56254807030c37';
  function rrUnlocked() { try { return localStorage.getItem('fxRRUnlocked') === RR_LOCK_HASH; } catch (e) { return false; } }
  async function rrHash(txt) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  function rrAskPassword() {
    let ov = document.getElementById('rr-lock');
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'rr-lock';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `<form style="background:#1b1f24;border:1px solid #333;border-radius:10px;padding:22px;width:320px;color:#e8e8e8;font-family:inherit;" onsubmit="event.preventDefault();rrTry()">

        <div style="font-size:13px;color:#aaa;margin-bottom:12px;">Not live yet. Enter the password to open it.</div>
        <input id="rr-pw" type="password" autocomplete="off" aria-label="Password" style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:6px;border:1px solid #444;background:#111;color:#fff;font-size:14px;">
        <div id="rr-pw-err" style="color:#f87171;font-size:12px;min-height:16px;margin-top:6px;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
          <button type="button" onclick="document.getElementById('rr-lock').remove()" style="background:none;border:1px solid #444;color:#ddd;border-radius:6px;padding:7px 12px;cursor:pointer;">Cancel</button>
          <button type="submit" style="background:#f5b301;border:none;color:#111;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;">Open</button></div></form>`;
      document.body.appendChild(ov);
    }
    setTimeout(() => { const i = document.getElementById('rr-pw'); if (i) i.focus(); }, 30);
  }
  async function rrTry() {
    const v = document.getElementById('rr-pw').value;

  let rmaBadgeTimer = null, rmaBadgeRole = null, rmaBadgeEmail = '';

  function rmaTaskCount(role, rmas, items, email) {
    const now = Date.now();
    // Warehouse tasks go to the RMA's handler; unassigned ones show for the whole warehouse
    const wh = r => role === 'warehouse' && (!r.warehouse_owner || r.warehouse_owner.toLowerCase() === email);
    const days = t => t ? (now - new Date(t).getTime()) / 864e5 : 0;
    const owner = { 'Replace': 'edgar', 'Credit': 'val', 'Charge customer': 'val', 'Repair': 'warehouse', 'Return as-is': 'warehouse', 'Other': 'edgar' };
    let n = 0;
    rmas.forEach(r => {
      if (r.status === 'New') { if (role === 'shyam') n++; }
      else if (r.status === 'Awaiting arrival') {
        if (r.delivered_at) { if (wh(r)) n++; }
        else if (!r.inbound_tracking) { if (role === 'shyam') n++; }
        else if (days(r.label_sent_at || r.created_at) >= 10) { if (role === 'shyam') n++; }
      }
      else if (r.status === 'Inspect') { if (wh(r)) n++; }
      else if (r.status === 'Decide') { if ((r.owner_email || 'edgar.vargas@fxairguns.com').toLowerCase() === email) n++; }
      else if (r.status === 'In progress') {
        // Fixed order after the decision: 1. Val invoices, 2. warehouse puts away, 3. Shyam closes
        if (r.phase === 'val') { if ((r.owner_email || 'val.diamond@fxairguns.com').toLowerCase() === email) n++; }
        else if (r.phase === 'warehouse') { if (wh(r)) n++; }
        else if (r.phase === 'shyam') { if (role === 'shyam') n++; }
      }
    });
    return n;
  }

  async function refreshRmaBadge() {
    const badge = document.getElementById('badge-rma');
    if (!badge || !rmaBadgeRole) { if (badge) badge.style.display = 'none'; return; }
    try {
      const { data: rmas, error } = await sb.from('rmas')
        .select('id,status,phase,owner_email,delivered_at,inbound_tracking,label_sent_at,created_at,customer_notified_at,warehouse_owner')
        .not('status', 'in', '("Closed","Cancelled")');
      if (error) throw error;
      let items = [];
      const active = (rmas || []).filter(r => r.status === 'In progress').map(r => r.id);
      if (active.length) {
        const res = await sb.from('rma_items')
          .select('rma_id,received_status,outcome,outcome_other,action_done,disposition_done')
          .in('rma_id', active);
        if (res.error) throw res.error;
        items = res.data || [];

      const n = rmaTaskCount(rmaBadgeRole, rmas || [], items, rmaBadgeEmail);
      badge.textContent = n;
      badge.style.display = n ? '' : 'none';

  // ── LINKS INTO AN RMA (from the Teams cards) ───────────
  // fxairguns.netlify.app/#rma-<id> opens the RMA tab with that RMA's panel open.
  function openRmaFromHash() {
    const m = (location.hash || '').match(/^#rma(?:-([\w-]+))?$/);

  // ── MASTER SEARCH ─────────────────────────────────────
  const SB_URL = 'https://rhvmzaljkgqnwjcstnen.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJodm16YWxqa2dxbndqY3N0bmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTA0OTksImV4cCI6MjA5NzI4NjQ5OX0.3qPGkA9tyvTDWqPQrBjJUnp9_PzNxBJQ-NCv2dUo2DE';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  // ── AUTO-REFRESH AFTER AN APP IS UPDATED ───────────────
  // When any app (or the Shell itself) finishes deploying on Netlify, the tracking
  // server records it in app_deploys and every open Shell refreshes that app.
  // It never refreshes an app while someone is working in it: it waits until they
  // click out of it (or switch tabs), then refreshes.
  const DEPLOY_TAB_KEYS = ['inbound', 'releases', 'repair', 'kb', 'sales', 'qc', 'eorma', 'invoicewatch', 'ernestcal', 'rma', 'dealers', 'safetylog', 'tasks', 'repairrecord'];
  let deployChannel = null, shellUpdateWaiting = false;
  const framesWaiting = new Set();
  document.querySelectorAll('iframe.app-frame').forEach(f => { f.dataset.baseSrc = f.getAttribute('src'); });
  function frameHost(f) { try { return new URL(f.dataset.baseSrc).hostname.toLowerCase(); } catch (e) { return ''; } }
  function startDeployWatch() {
    if (deployChannel) return;
    deployChannel = sb.channel('app-deploys')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_deploys' }, p => onAppDeployed((p.new || {}).host))
      .subscribe();
  }
  function stopDeployWatch() { if (deployChannel) { sb.removeChannel(deployChannel); deployChannel = null; } }
  function onAppDeployed(host) {
    host = String(host || '').toLowerCase();
    if (!host) return;
    if (host === location.hostname.toLowerCase()) shellUpdateWaiting = true;
    else document.querySelectorAll('iframe.app-frame').forEach(f => { if (frameHost(f) === host) framesWaiting.add(f.id); });
    applyWaitingUpdates();
  }
  // Someone is working inside this app right now (their cursor is in it)
  function frameInUse(f) { return document.hasFocus() && document.activeElement === f && f.classList.contains('active'); }
  function shellInUse() {
    const a = document.activeElement;
    if (!document.hasFocus()) return false;
    if (a && a.tagName === 'IFRAME') return true;
    return !!(a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && (a.value || '').length > 0);
  }
  function refreshFrame(f) {
    const base = f.dataset.baseSrc;
    f.src = base + (base.includes('?') ? '&' : '?') + '_v=' + Date.now();
  }
  function applyWaitingUpdates() {
    if (shellUpdateWaiting) {
      if (!shellInUse()) {
        const active = document.querySelector('.app-frame.active');
        try { sessionStorage.setItem('fx_shell_restore_tab', active ? active.id.replace('frame-', '') : ''); } catch (e) {}
        location.reload();
        return;
      }
    }
    framesWaiting.forEach(id => {
      const f = document.getElementById(id);
      if (!f) { framesWaiting.delete(id); return; }
      if (!frameInUse(f)) { framesWaiting.delete(id); refreshFrame(f); }
    });
    updateDeployBar();
  }
  function updateDeployBar() {
    const bar = document.getElementById('deploy-bar');
    const n = framesWaiting.size + (shellUpdateWaiting ? 1 : 0);
    if (!n) { bar.style.display = 'none'; return; }
    const names = [...framesWaiting].map(id => (document.getElementById(id) || {}).title).filter(Boolean);
    if (shellUpdateWaiting) names.unshift('the Shell');
    document.getElementById('deploy-bar-text').textContent = '🔄 ' + names.join(', ') + ' just got an update. It refreshes as soon as you click out.';
    bar.style.display = 'flex';
  }
  function refreshUpdatesNow() {
    if (shellUpdateWaiting) {
      const active = document.querySelector('.app-frame.active');
      try { sessionStorage.setItem('fx_shell_restore_tab', active ? active.id.replace('frame-', '') : ''); } catch (e) {}
      location.reload();
      return;
    }
    framesWaiting.forEach(id => { const f = document.getElementById(id); if (f) refreshFrame(f); });
    framesWaiting.clear();
    updateDeployBar();
  }
  setInterval(() => { if (shellUpdateWaiting || framesWaiting.size) applyWaitingUpdates(); }, 2000);
  // After the Shell refreshes itself, come back to the tab the person was on
  function restoreTabAfterUpdate() {
    let key = '';
    try { key = sessionStorage.getItem('fx_shell_restore_tab') || ''; sessionStorage.removeItem('fx_shell_restore_tab'); } catch (e) {}
    const i = DEPLOY_TAB_KEYS.indexOf(key);
    if (i < 0) return;
    const btn = document.querySelectorAll('.nav-tab')[i];
    if (btn && btn.style.display !== 'none' && document.getElementById('frame-' + key)) switchTab(key);
  }

  // ── PER-USER APP RESTRICTIONS ──────────────────────────
  // Map of restricted user email -> array of tab keys they're allowed to see.
  // Everyone not listed here sees every tab, as before.
    const RESTRICTED_USERS = {
    'newman@fxairguns.com': ['repair', 'tasks'],
    'erowe323@icloud.com': ['ernestcal', 'tasks']
  };

  // Tabs visible ONLY to this one account, regardless of the restriction
  // map above (this is an allow-list of one, not a deny-list).
  const SHYAM_ONLY_TABS = ['invoicewatch', 'safetylog'];
  const SHYAM_EMAIL = 'shyam.patel@fxairguns.com';

    function applyShyamOnlyRestriction(email) {
    const isShyam = (email || '').toLowerCase() === SHYAM_EMAIL;
    const tabKeys = ['inbound', 'releases', 'repair', 'kb', 'sales', 'qc', 'eorma', 'invoicewatch', 'ernestcal', 'rma', 'dealers', 'safetylog', 'tasks', 'repairrecord'];
    const navTabButtons = document.querySelectorAll('.nav-tab');
    SHYAM_ONLY_TABS.forEach(key => {
      const idx = tabKeys.indexOf(key);
      const btn = navTabButtons[idx];
      if (btn) btn.style.display = isShyam ? '' : 'none';
    });
        if (!isShyam) {
      const activeFrame = document.querySelector('.app-frame.active');
      const activeKey = activeFrame ? activeFrame.id.replace('frame-', '') : null;
      if (SHYAM_ONLY_TABS.includes(activeKey)) switchTab('inbound');
    }
  }

  // Ernest Consulting Calendar tab — visible only to this allow-list.
  const ERNEST_CAL_TAB = 'ernestcal';
    const ERNEST_CAL_ALLOWED_EMAILS = [
    'shyam.patel@fxairguns.com',
    'erowe323@icloud.com',
    'hoyt@fxairguns.com',
    'johan.axelsson@fxairguns.com'
  ];
  const ERNEST_EMAIL = 'erowe323@icloud.com';

  function applyErnestCalRestriction(email) {
    const normalizedEmail = (email || '').toLowerCase();
      const ERNEST_CAL_ENABLED = false; // ← set to true to bring the Ernest Cal tab back
    const isAllowed = ERNEST_CAL_ENABLED && ERNEST_CAL_ALLOWED_EMAILS.includes(normalizedEmail);  
     const tabKeys = ['inbound', 'releases', 'repair', 'kb', 'sales', 'qc', 'eorma', 'invoicewatch', 'ernestcal', 'rma'];   
    const idx = tabKeys.indexOf(ERNEST_CAL_TAB);
    const btn = document.querySelectorAll('.nav-tab')[idx];
    if (btn) btn.style.display = isAllowed ? '' : 'none';
      if (!isAllowed && normalizedEmail !== ERNEST_EMAIL) {
      const activeFrame = document.querySelector('.app-frame.active');
      const activeKey = activeFrame ? activeFrame.id.replace('frame-', '') : null;
      if (activeKey === ERNEST_CAL_TAB) switchTab('inbound');
    }
  }

    const TRACKING_SERVER_URL = 'https://fx-tracking-server.onrender.com';

  async function loadWatchedInvoices() {
    const el = document.getElementById('iw-list');
    if (!el) return;
    el.innerHTML = '<div style="font-size:12px;color:#888;">Loading...</div>';
    try {
      const { data, error } = await sb.from('bill_invoice_watch').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      renderWatchedInvoices(data || []);
    } catch (e) {
      el.innerHTML = '<div style="font-size:12px;color:#e06060;">Could not load: ' + e.message + '</div>';
    }
  }

  function renderWatchedInvoices(rows) {
    const el = document.getElementById('iw-list');
    if (!rows.length) { el.innerHTML = '<div style="font-size:12px;color:#888;padding:20px 0;text-align:center;">No invoices being watched yet.</div>'; return; }

      const paid = r.status === 'Paid';
           const amountStr = (typeof r.total_amount === 'number') ? '$' + r.total_amount.toFixed(2) : '';
      const dueStr = r.due_date ? ('Due ' + r.due_date) : '';
      const metaLine = [r.customer_name, amountStr, dueStr].filter(Boolean).join(' · ');
      return `<div style="display:flex;align-items:center;justify-content:space-between;background:#1d1d1d;border:1px solid #2a2a2a;border-radius:8px;padding:12px 14px;margin-bottom:8px;">

          <div style="font-size:14px;font-weight:600;color:#eee;">${escHtml(r.invoice_number)}</div>

          ${r.label ? '<div style="font-size:11px;color:#777;margin-top:2px;">' + escHtml(r.label) + '</div>' : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:${paid ? '#0d2a0d' : '#222'};color:${paid ? '#6dcc6d' : '#888'};">${escHtml(r.status || 'Watching')}</span>

        </div>
      </div>`;
    }).join('');

  async function addWatchedInvoice() {
    const invInp = document.getElementById('iw-new-invoice');
    const labelInp = document.getElementById('iw-new-label');
    const addBtn = document.querySelector('button[onclick="addWatchedInvoice()"]');
    const invoiceNumber = invInp.value.trim();
    const label = labelInp.value.trim();
    if (!invoiceNumber) return;

    if (addBtn) { addBtn.disabled = true; addBtn.textContent = 'Looking up...'; }

    let customerName = null, totalAmount = null, dueDate = null;
    try {
      const lookupRes = await fetch(TRACKING_SERVER_URL + '/lookup-invoice?number=' + encodeURIComponent(invoiceNumber));
      const lookupData = await lookupRes.json();
      if (lookupData && lookupData.found) {
        customerName = lookupData.customerName || null;
        totalAmount = (typeof lookupData.totalAmount === 'number') ? lookupData.totalAmount : null;
        dueDate = lookupData.dueDate || null;
      }
    } catch (e) {
      // Lookup failing shouldn't block adding the invoice to the watchlist —
      // the name/amount will just stay blank until the next poll cycle backfills it.

      invInp.value = ''; labelInp.value = '';
      loadWatchedInvoices();
    } catch (e) {
      alert('Could not add: ' + e.message);

    function buildCalendarGrid(rows) {
    const year = ecCalendarMonth.getFullYear();
    const month = ecCalendarMonth.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    const monthLabel = ecCalendarMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    let cells = '';
    for (let i = 0; i < startWeekday; i++) cells += `<div></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const cellDate = new Date(year, month, day);
      const key = ecDateKey(cellDate);
      const dayBookings = rows.filter(r => ecDateKey(new Date(r.scheduled_at)) === key)
        .sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
      const isToday = ecDateKey(today) === key;
      const isSelected = ecDateKey(ecSelectedDay) === key;
      const maxPillsShown = 2;
      const shownBookings = dayBookings.slice(0, maxPillsShown);
      const extraCount = dayBookings.length - shownBookings.length;

        const timeLabel = new Date(r.scheduled_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    async function loadAttachmentThumbnails() {
    const els = document.querySelectorAll('.ec-att-thumb[data-path]');
    for (const el of els) {
      const path = el.getAttribute('data-path');
      if (!path || el.dataset.loaded) continue;
      try {
        const { data, error } = await sb.storage.from('ernest-attachments').createSignedUrl(path, 3600);
        if (!error && data && data.signedUrl) {
          if (el.tagName === 'IMG') el.src = data.signedUrl;
          else el.href = data.signedUrl;
          el.dataset.loaded = '1';
        }
      } catch (e) { /* ignore */ }
    }
  }

   async function ecSaveBookingEdit(id) {
    const dateVal = document.getElementById('ec-edit-date').value;
    const timeVal = document.getElementById('ec-edit-time').value;
    const name = document.getElementById('ec-edit-name').value.trim();
    const phone = document.getElementById('ec-edit-phone').value.trim();
    const ticket = document.getElementById('ec-edit-ticket').value.trim();
    const model = document.getElementById('ec-edit-model').value.trim();
    const note = document.getElementById('ec-edit-note').value.trim();
        const issueType = document.getElementById('ec-edit-issue').value;
    const resolutionNotes = document.getElementById('ec-edit-resolution').value.trim();
    const durationVal = document.getElementById('ec-edit-duration').value;
    const followUp = document.getElementById('ec-edit-followup').checked;
    const repair = document.getElementById('ec-edit-repair').checked;
    if (!dateVal || !timeVal) { alert('Pick a date and time.'); return; }
    const [y, m, d] = dateVal.split('-').map(Number);
    const [hh, mm] = timeVal.split(':').map(Number);
    const scheduled = new Date(y, m - 1, d, hh, mm);
    try {
      const { error } = await sb.from('ernest_bookings').update({
        scheduled_at: scheduled.toISOString(),
        customer_name: name || null,
        phone: phone || null,
        ticket_number: ticket || null,
        rifle_model: model || null,
        note: note || null,
        issue_type: issueType || null,
        resolution_notes: resolutionNotes || null,
        call_duration_minutes: durationVal ? parseInt(durationVal, 10) : null,
        follow_up_needed: followUp,
        repair_needed: repair
      }).eq('id', id);
      if (error) throw error;
      ecCloseModal();
      loadErnestCal();
    } catch (e) {
      alert('Could not save: ' + e.message);
    }
  }

  async function ecUploadAttachment(bookingId, file) {
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const uploadedBy = sessionData && sessionData.session ? sessionData.session.user.email : null;
      const path = `${bookingId}/${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from('ernest-attachments').upload(path, file);
      if (upErr) throw upErr;
      const { error: insErr } = await sb.from('ernest_booking_attachments').insert({
        booking_id: bookingId, file_path: path, file_name: file.name, uploaded_by: uploadedBy
      });
      if (insErr) throw insErr;
      const { data: attData } = await sb.from('ernest_booking_attachments').select('*').eq('booking_id', bookingId).order('created_at', { ascending: true });
      ecAttachmentsByBooking[bookingId] = attData || [];
      const modalContainer = document.getElementById('ec-edit-attachments');
      if (modalContainer) {
        modalContainer.innerHTML = ecAttachmentsByBooking[bookingId].map(a => attachmentThumbHtml(a)).join('') || '<div style="font-size:12px;color:#888;">No photos yet.</div>';
      }
      const ernestContainer = document.getElementById('ec-ernest-attachments-' + bookingId);
      if (ernestContainer) {
        ernestContainer.innerHTML = ecAttachmentsByBooking[bookingId].map(a => attachmentThumbHtml(a)).join('');
      }
      loadAttachmentThumbnails();
    } catch (e) {
      alert('Could not upload photo: ' + e.message);
    }
  }

    }
  }

  function applyUserRestrictions(email) {
    const normalizedEmail = (email || '').toLowerCase();
    const allowedTabs = RESTRICTED_USERS[normalizedEmail];
    const tabKeys = ['inbound', 'releases', 'repair', 'kb', 'sales', 'qc', 'eorma', 'invoicewatch', 'ernestcal', 'rma', 'dealers', 'safetylog', 'tasks', 'repairrecord'];
    const navTabButtons = document.querySelectorAll('.nav-tab');

    if (!allowedTabs) {
      // Not a restricted user — make sure every tab is visible
      // (in case of a prior restricted session in the same browser tab).
      navTabButtons.forEach(btn => { btn.style.display = ''; });
      return;
    }

    tabKeys.forEach((key, i) => {
      const btn = navTabButtons[i];
      if (!btn) return;
      btn.style.display = allowedTabs.includes(key) ? '' : 'none';
    });

    // If the currently active tab isn't in their allowed list, jump to
    // the first tab they ARE allowed to see.
    const activeFrame = document.querySelector('.app-frame.active');
    const activeKey = activeFrame ? activeFrame.id.replace('frame-', '') : null;
    if (!activeKey || !allowedTabs.includes(activeKey)) {
      switchTab(allowedTabs[0]);
    }
  }

  // ── Single sign-on: share the session with every embedded app ──────────
  const CHILD_ORIGINS = {
    'frame-inbound': 'https://fxshippinglog.netlify.app',
    'frame-releases': 'https://fx-outbound.netlify.app',
    'frame-repair': 'https://fxairgunswarehouse.netlify.app',

     'frame-eorma': 'https://fx-eo-rma.netlify.app',

    'frame-safetylog': 'https://fx-safety-log.netlify.app',
    'frame-tasks': 'https://fx-tasks.netlify.app',
    'frame-repairrecord': 'https://fx-repair-record.netlify.app'
  };   
 

  function broadcastSessionToChild(frameId, session) {
    const el = document.getElementById(frameId);
    const origin = CHILD_ORIGINS[frameId];
    if (el && el.contentWindow && origin) {
      el.contentWindow.postMessage({
        type: 'FX_AUTH_SESSION',
        access_token: session.access_token,
        refresh_token: session.refresh_token
      }, origin);
    }
  }
  function broadcastLogoutToAllChildren() {
    Object.keys(CHILD_ORIGINS).forEach(frameId => {
      const el = document.getElementById(frameId);
      const origin = CHILD_ORIGINS[frameId];
      if (el && el.contentWindow && origin) {
        el.contentWindow.postMessage({ type: 'FX_AUTH_LOGOUT' }, origin);
      }
    });
  }
  // When a child app announces it's ready, send it the current session (if any)
  // Tasks badge: the Tasks app reports how many of your tasks are due today or overdue
  window.addEventListener('message', (event) => {
    if (event.origin !== 'https://fx-tasks.netlify.app' || !event.data || event.data.type !== 'FX_TASK_COUNT') return;
    const b = document.getElementById('badge-tasks'), n = Number(event.data.count) || 0;
    if (!b) return;
    b.textContent = n; b.style.display = n ? '' : 'none';
    document.getElementById('tab-tasks').title = n ? 'Tasks: ' + n + ' due today or overdue' : 'Tasks';
  });
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'FX_AUTH_READY') {
      sb.auth.getSession().then(({ data }) => {
        if (data.session) event.source.postMessage({
          type: 'FX_AUTH_SESSION',
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token
        }, event.origin);
      });
    }
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      hideAuthOverlay(session.user.email);
      applyUserRestrictions(session.user.email);
      applyShyamOnlyRestriction(session.user.email);
      applyErnestCalRestriction(session.user.email);
      startRmaBadge(session.user.email);
      startDeployWatch();
    Object.keys(CHILD_ORIGINS).forEach(frameId => broadcastSessionToChild(frameId, session));
    } else {
      showAuthOverlay();
      stopRmaBadge();
      stopDeployWatch();
      broadcastLogoutToAllChildren();
    }
  });

  // Initial session check on page load

    const pattern = '%' + q + '%';

    try {
      const [inbound, releases, repairs, shipNotes, repairNotes] = await Promise.all([
        sb.from('shipments').select('id,tracking,description,carrier,item_type')
          .or(`tracking.ilike.${pattern},description.ilike.${pattern},carrier.ilike.${pattern},item_type.ilike.${pattern}`)
          .limit(8),
        sb.from('outbound_shipments').select('id,dealer_name,shipment_number,invoice_number,pick_list_number,tracking_number,notes')
          .or(`dealer_name.ilike.${pattern},shipment_number.ilike.${pattern},invoice_number.ilike.${pattern},pick_list_number.ilike.${pattern},tracking_number.ilike.${pattern},notes.ilike.${pattern}`)
          .limit(8),
        sb.from('repair_tickets').select('id,customer_name,ticket_number,model,serial_number,tracking,incoming_tracking')
          .or(`customer_name.ilike.${pattern},ticket_number.ilike.${pattern},model.ilike.${pattern},serial_number.ilike.${pattern},tracking.ilike.${pattern},incoming_tracking.ilike.${pattern}`)
          .limit(8),
        sb.rpc('search_shipment_notes', { q }).then(r => r).catch(() => ({ data: [] })),
        sb.rpc('search_repair_notes', { q }).then(r => r).catch(() => ({ data: [] }))
      ]);

      renderSearchResults(q, inbound.data || [], releases.data || [], repairs.data || [], shipNotes.data || [], repairNotes.data || []);
    } catch (e) {
      resultsEl.innerHTML = '<div class="sr-empty">Search failed: ' + e.message + '</div>';
    }
  }

  function renderSearchResults(q, inbound, releases, repairs, shipNotes, repairNotes) {
    const resultsEl = document.getElementById('search-results');
    const total = inbound.length + releases.length + repairs.length + shipNotes.length + repairNotes.length;
    if (!total) { resultsEl.innerHTML = '<div class="sr-empty">No matches for "' + escHtml(q) + '"</div>'; return; }

    let html = '';
    if (inbound.length) {
      html += '<div class="sr-group-title">📥 Inbound Tracker</div>';
      inbound.forEach(r => {
        html += `<div class="sr-item" onclick="jumpTo('inbound','${r.id}')">
          <div class="sr-main">${escHtml(r.description || r.tracking || '—')}</div>
          <div class="sr-sub">${escHtml(r.carrier || '')} ${r.tracking ? '· ' + escHtml(r.tracking) : ''} ${r.item_type ? '· ' + escHtml(r.item_type) : ''}</div>
        </div>`;
      });
    }
    if (releases.length) {
      html += '<div class="sr-group-title">🚚 Release Board</div>';
      releases.forEach(r => {
        html += `<div class="sr-item" onclick="jumpTo('releases','${r.id}')">
          <div class="sr-main">${escHtml(r.dealer_name || '—')} — ${escHtml(r.shipment_number || '')}</div>
          <div class="sr-sub">${r.invoice_number ? 'Inv# ' + escHtml(r.invoice_number) + ' ' : ''}${r.pick_list_number ? '· PL# ' + escHtml(r.pick_list_number) + ' ' : ''}${r.tracking_number ? '· ' + escHtml(r.tracking_number) : ''}</div>
        </div>`;
      });
    }
    if (repairs.length) {
      html += '<div class="sr-group-title">🔧 Repair Queue</div>';
      repairs.forEach(r => {
        html += `<div class="sr-item" onclick="jumpTo('repair','${r.id}')">
          <div class="sr-main">${escHtml(r.customer_name || '—')} — TKT #${escHtml(r.ticket_number || '')}</div>
          <div class="sr-sub">${escHtml(r.model || '')} ${r.serial_number ? '· SN ' + escHtml(r.serial_number) : ''} ${(r.tracking || r.incoming_tracking) ? '· ' + escHtml(r.tracking || r.incoming_tracking) : ''}</div>
        </div>`;
      });
    }
    if (shipNotes.length || repairNotes.length) {
      html += '<div class="sr-tier2-label">Also mentioned in Notes:</div>';
      shipNotes.forEach(r => {
        html += `<div class="sr-item" onclick="jumpTo('inbound','${r.id}')">
          <div class="sr-main">📥 ${escHtml(r.description || r.tracking || '—')}</div>
          <div class="sr-sub">"${escHtml((r.matched_note || '').slice(0,80))}"</div>
        </div>`;
      });
      repairNotes.forEach(r => {
        html += `<div class="sr-item" onclick="jumpTo('repair','${r.id}')">
          <div class="sr-main">🔧 ${escHtml(r.customer_name || '—')} — TKT #${escHtml(r.ticket_number || '')}</div>
          <div class="sr-sub">"${escHtml((r.matched_note || '').slice(0,80))}"</div>
        </div>`;
      });
    }
    resultsEl.innerHTML = html;
  }

  function jumpTo(tab, recordId) {
    const tabMap = { inbound: 0, releases: 1, repair: 2, kb: 3, sales: 4, qc: 5, eorma: 6 };
    switchTab(tab);
    document.querySelectorAll('.nav-tab')[tabMap[tab]].classList.add('active');
    closeSearchResults();
    if (recordId) {
      const frame = document.getElementById('frame-' + tab);
      const send = () => frame.contentWindow.postMessage({ type: 'fx-open-record', id: recordId }, '*');
      // Iframe is already loaded (tabs stay mounted) — send right away, and
      // again shortly after in case the app is still finishing its own render.
      send();
      setTimeout(send, 400);
    }
  }

   // ── PART PHOTO LOOKUP ──────────────────────────────────
  const PL_BUCKET = 'part-photos';
  const PL_MAX_RESULTS = 30;
  let plFiles = null;
  let plFuse = null;
  let plUrlCache = {};
  let plUrlCacheAt = 0;
  let plTimer = null;
  let plLastQuery = '';

  function plNorm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function plAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

  async function openPartLookup() {
    document.getElementById('pl-overlay').classList.add('open');
    plCloseViewer();
    const inp = document.getElementById('pl-search');
    setTimeout(() => { inp.focus(); inp.select(); }, 50);
    if (!plFiles) await plLoadIndex();
  }
  function closePartLookup() { document.getElementById('pl-overlay').classList.remove('open'); }

  async function plLoadIndex() {
    const status = document.getElementById('pl-status');
    status.textContent = 'Loading part list…';
    try {
      const all = [];
      for (let offset = 0; ; offset += 1000) {
        const { data, error } = await sb.storage.from(PL_BUCKET).list('', { limit: 1000, offset, sortBy: { column: 'name', order: 'asc' } });
        if (error) throw error;
        all.push(...(data || []));
        if (!data || data.length < 1000) break;
      }
      plFiles = all.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name)).map(f => {
        const part = f.name.replace(/\.[^.]+$/, '');
        return { name: f.name, part: part, norm: plNorm(part) };
      });
      plFuse = window.Fuse ? new Fuse(plFiles, { keys: ['norm'], threshold: 0.3, ignoreLocation: true }) : null;
      status.textContent = plFiles.length + ' parts. Type a part number to find its photo.';
      if (document.getElementById('pl-search').value.trim()) plRunSearch();
    } catch (e) {
      plFiles = null;
      status.textContent = 'Could not load the part list: ' + e.message;
    }
  }

  function plOnInput() { clearTimeout(plTimer); plTimer = setTimeout(plRunSearch, 150); }

  function plFind(q) {
    const nq = plNorm(q);
    if (!nq) return [];
    const exact = [], starts = [], contains = [];
    plFiles.forEach(f => {
      if (f.norm === nq) exact.push(f);
      else if (f.norm.startsWith(nq)) starts.push(f);
      else if (f.norm.includes(nq)) contains.push(f);
    });
        const out = exact.concat(starts, contains);
    if (out.length) return out;
    // Nothing matched directly — fall back to close spellings (typo safety net)
    if (plFuse && nq.length >= 3) return plFuse.search(nq).slice(0, 8).map(r => r.item);
    return [];
  }

  async function plSignUrls(names) {
    if (Date.now() - plUrlCacheAt > 50 * 60 * 1000) { plUrlCache = {}; plUrlCacheAt = Date.now(); }
    const need = names.filter(n => !plUrlCache[n]);
    if (!need.length) return;
    try {
      const { data, error } = await sb.storage.from(PL_BUCKET).createSignedUrls(need, 3600);
      if (error) throw error;
      (data || []).forEach(d => { if (d.signedUrl) plUrlCache[d.path] = d.signedUrl; });
    } catch (e) { console.warn('Part photo URL error:', e.message); }
  }

  async function plRunSearch() {
    if (!plFiles) return;
    const q = document.getElementById('pl-search').value.trim();
    plLastQuery = q;
    const status = document.getElementById('pl-status');
    const el = document.getElementById('pl-results');
    if (!q) { el.innerHTML = ''; status.textContent = plFiles.length + ' parts. Type a part number to find its photo.'; return; }
    const matches = plFind(q);
    if (!matches.length) { el.innerHTML = ''; status.textContent = 'No photo found for "' + q + '". Check the part number and try again.'; return; }
    const shown = matches.slice(0, PL_MAX_RESULTS);
    status.textContent = matches.length + ' match' + (matches.length === 1 ? '' : 'es') + (matches.length > shown.length ? ' (showing the first ' + shown.length + ')' : '');
    el.innerHTML = shown.map(f => '<div class="pl-card" data-name="' + plAttr(f.name) + '"><img data-name="' + plAttr(f.name) + '" alt=""><div class="pl-name">' + escHtml(f.part) + '</div></div>').join('');
    await plSignUrls(shown.map(f => f.name));
    if (plLastQuery !== q) return;
    el.querySelectorAll('img[data-name]').forEach(img => { const u = plUrlCache[img.dataset.name]; if (u) img.src = u; });
  }

  async function plOpenViewer(name) {
    const f = (plFiles || []).find(x => x.name === name);
    if (!f) return;
    await plSignUrls([name]);
    const url = plUrlCache[name] || '';
    const v = document.getElementById('pl-viewer');
    v.innerHTML = '<div class="pl-vbar"><span class="pl-vpart">' + escHtml(f.part) + '</span><div style="display:flex;gap:8px;">'
      + '<button id="pl-copy">Copy part #</button><button id="pl-open">Open full size</button><button id="pl-back">← Back</button></div></div>'
      + '<img src="' + plAttr(url) + '" alt="">';
    v.style.display = 'flex';
    document.getElementById('pl-back').onclick = plCloseViewer;
    document.getElementById('pl-open').onclick = () => { if (url) window.open(url, '_blank'); };
    document.getElementById('pl-copy').onclick = (e) => {
      navigator.clipboard.writeText(f.part).then(() => {
        e.target.textContent = 'Copied';
        setTimeout(() => { e.target.textContent = 'Copy part #'; }, 1500);
      });
    };
  }
  function plCloseViewer() { const v = document.getElementById('pl-viewer'); v.style.display = 'none'; v.innerHTML = ''; }

  document.getElementById('pl-results').addEventListener('click', e => {
    const c = e.target.closest('.pl-card');
    if (c) plOpenViewer(c.dataset.name);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !document.getElementById('pl-overlay').classList.contains('open')) return;
    if (document.getElementById('pl-viewer').style.display !== 'none') plCloseViewer();
    else closePartLookup();
  });

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }
</script>
